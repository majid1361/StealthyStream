name: StealthyStream Multi-Source Aggregator

on:
  schedule:
    - cron: '0 */6 * * *' # هر ۶ ساعت یکبار
  workflow_dispatch: # اجازه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch and Merge Sources
        run: |
          # ایجاد یک فایل موقت برای ذخیره همه لینک‌ها
          touch all_sources_combined.txt

          # لیست تمام منابع (URLها)
          URLS=(
            "https://raw.githubusercontent.com/ebrasha/ebrasha/main/all_extracted_configs.txt"
            "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2"
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
            "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt"
          )

          echo "Starting to fetch sources..."

          for url in "${URLS[@]}"; do
            echo "Fetching: $url"
            # دانلود فایل و استخراج خطوطی که با پروتکل‌های Hy2 شروع می‌شوند
            # استفاده از -s برای حالت بی‌صدا و -L برای دنبال کردن Redirectها
            curl -sL "$url" | grep -E "^(hysteria2://|hy2://)" >> all_sources_combined.txt || echo "No Hy2 found in $url"
          done

          echo "Merging and removing duplicates..."
          
          # مراحل نهایی:
          # 1. sort: مرتب کردن
          # 2. uniq: حذف خطوط تکراری
          # 3. ذخیره در فایل نهایی
          sort all_sources_combined.txt | uniq > hy2_filtered.txt

          echo "Process complete!"
          echo "Total unique Hy2 configs found: $(wc -l < hy2_filtered.txt)"

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hy2_filtered.txt
          git commit -m "Update Hy2 list from multiple sources [skip ci]" || echo "No changes to commit"
          git push
