name: StealthyStream Multi-Source Aggregator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Fetch, Deduplicate and Normalize Configs
        run: |
          python - << 'EOF'
          import re
          import requests
          import base64
          from urllib.parse import urlparse, parse_qs

          # ==========================================
          # 1. تنظیمات و منابع عمومی (Public URLs)
          # ==========================================
          HY2_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub2.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub3.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub4.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub5.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub6.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub7.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub8.txt",
              "https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/xray/base64/mix",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/hysteria",
          ]

          VLESS_TROJAN_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/trojan.txt",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/trojan",
              "https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/xray/base64/vless",
              "https://raw.githubusercontent.com/yebekhe/TVC/main/subscriptions/xray/base64/trojan",
          ]

          TELEGRAM_CHANNELS = [
              "vless_vmess",
              "v2line",
              "freelandv2ray",
              "Config_Freee",
              "VPNCUSTOMIZE",
              "v2ray_vpn_ir",
              "PrivateVPNs",
              "bypass_filter",
              "DirectVPN",
              "Outline_Vpn",
              "prrofile_purple",
              "ShadowSocks_s",
              "customv2ray",
              "moj_vpn",
              "ConfigsHUB",
              "SafeNet_VMess",
              "DailyV2RY",
              "v2rayNG_VPNo",
              "lrnvpn",
              "vpn_tehran",
              "Fox_VPN6",
              "vpn_ocean",
              "marzban_v2ray"
          ]

          TIMEOUT = 12
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          HY2_PROTOCOLS = ("hysteria2://", "hy2://")
          VLESS_TROJAN_PROTOCOLS = ("vless://", "trojan://")
          ALL_PROTOCOLS = HY2_PROTOCOLS + VLESS_TROJAN_PROTOCOLS

          UNSAFE_PATTERNS = [
              "127.0.0.1", "localhost", "0.0.0.0",
              "::1",
              "allowinsecure=1",
              "insecure=1",
              "xhttp",
              "security=none",
              "security=null",
              "mitm"
          ]

          CONFIG_REGEX = re.compile(r'(?:hysteria2|hy2|vless|trojan)://[^\s<>"\']+', re.IGNORECASE)

          raw_hy2_items = []
          raw_vless_trojan_items = []

          # ==========================================
          # 2. خواندن کانفیگ‌های اختصاصی (custom.txt)
          # ==========================================
          try:
              with open('custom.txt', 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              for line in lines:
                  line_clean = line.strip()
                  if line_clean.startswith(HY2_PROTOCOLS):
                      raw_hy2_items.append(line_clean)
                  elif line_clean.startswith(VLESS_TROJAN_PROTOCOLS):
                      raw_vless_trojan_items.append(line_clean)
              print(f"Loaded from custom.txt: Hy2={len(raw_hy2_items)}, Vless/Trojan={len(raw_vless_trojan_items)}")
          except FileNotFoundError:
              print("custom.txt not found, skipping...")

          def decode_if_base64(content):
              clean = content.strip().replace('\r', '').replace('\n', '')
              if "://" not in clean:
                  try:
                      missing_padding = len(clean) % 4
                      if missing_padding:
                          clean += '=' * (4 - missing_padding)
                      return base64.b64decode(clean).decode('utf-8', errors='ignore')
                  except Exception:
                      pass
              return content

          def fetch_urls(urls, target_protocols, target_list, label):
              count = 0
              for url in urls:
                  try:
                      resp = requests.get(url, headers=HEADERS, timeout=TIMEOUT)
                      if resp.status_code == 200:
                          content = decode_if_base64(resp.text)
                          lines = content.replace('\r', '').split('\n')[:100]
                          for line in lines:
                              line_clean = line.strip()
                              if line_clean.startswith(target_protocols):
                                  target_list.append(line_clean)
                                  count += 1
                  except Exception:
                      continue
              print(f"Fetched {count} items from {label}")

          def fetch_telegram_channels(channels):
              hy2_count = 0
              vless_trojan_count = 0
              session = requests.Session()
              for ch in channels:
                  url = f"https://t.me/s/{ch}"
                  try:
                      resp = session.get(url, headers=HEADERS, timeout=TIMEOUT)
                      if resp.status_code == 200:
                          found_configs = CONFIG_REGEX.findall(resp.text)
                          for cfg in found_configs[-50:]:
                              cfg_clean = cfg.strip().rstrip('.,;()[]{}')
                              cfg_lower = cfg_clean.lower()
                              if cfg_lower.startswith(HY2_PROTOCOLS):
                                  raw_hy2_items.append(cfg_clean)
                                  hy2_count += 1
                              elif cfg_lower.startswith(VLESS_TROJAN_PROTOCOLS):
                                  raw_vless_trojan_items.append(cfg_clean)
                                  vless_trojan_count += 1
                  except Exception:
                      continue
              print(f"Telegram scrape finished: Hy2={hy2_count}, Vless/Trojan={vless_trojan_count}")

          # ==========================================
          # 3. دریافت داده‌ها از منابع
          # ==========================================
          # fetch_urls(HY2_PUBLIC_URLS, HY2_PROTOCOLS, raw_hy2_items, "HY2 GitHub")
          # fetch_urls(VLESS_TROJAN_PUBLIC_URLS, VLESS_TROJAN_PROTOCOLS, raw_vless_trojan_items, "VLESS/Trojan GitHub")
          fetch_telegram_channels(TELEGRAM_CHANNELS)

          # ==========================================
          # 4. پالایش متمرکز و یکپارچه (Validation & Dedup)
          # ==========================================
          seen_keys = set()

          def process_and_dedup(raw_list):
              cleaned = []
              for line in raw_list:
                  line_clean = line.strip()
                  line_lower = line_clean.lower()

                  # الف) چک کردن عبارات ناامن و مسدود
                  if any(p in line_lower for p in UNSAFE_PATTERNS):
                      continue

                  try:
                      parsed = urlparse(line_clean)
                      scheme = parsed.scheme.lower()
                      params = parse_qs(parsed.query)

                      # ب) فیلتر دقیق امنیتی برای VLESS و Trojan (حذف کانفیگ‌های برهنه و بدون TLS/Reality)
                      if scheme in ['vless', 'trojan']:
                          sec = params.get('security', [''])[0].lower().strip()
                          if not sec or sec in ['none', 'null']:
                              continue
                          if scheme == 'trojan' and sec not in ['tls', 'reality']:
                              continue

                      # ج) استخراج کلید اختصاصی جهت یکتا بودن (Deduplication)
                      user_info = parsed.netloc.rsplit('@', 1)[0] if '@' in parsed.netloc else ''
                      netloc = parsed.netloc.split('@')[-1]
                      host, port = (netloc.split(':', 1) + ['443'])[:2]
                      host = host.lower().strip()
                      port = port.strip()
                      sni = params.get('sni', [''])[0].lower().strip()
                      proto = scheme

                      unique_key = f"{proto}:{user_info}:{host}:{port}:{sni}"
                      if unique_key in seen_keys:
                          continue
                      seen_keys.add(unique_key)

                      # د) حذف تگ قبلی کانفیگ برای نام‌گذاری یکدست
                      base_config = line_clean.split('#')[0].strip()
                      cleaned.append(base_config)
                  except Exception:
                      continue
              return cleaned

          cleaned_hy2 = process_and_dedup(raw_hy2_items)
          cleaned_vless_trojan = process_and_dedup(raw_vless_trojan_items)

          print(f"Total Unique Valid Hy2: {len(cleaned_hy2)}")
          print(f"Total Unique Valid Vless/Trojan: {len(cleaned_vless_trojan)}")

          # ==========================================
          # 5. شماره‌گذاری متوالی و ذخیره‌سازی
          # ==========================================
             # مدیریت کانتر سراسری
        counter_file = "counter.txt"
        start_counter = 1
        if os.path.exists(counter_file):
            try:
                with open(counter_file, "r", encoding="utf-8") as f:
                    content = f.read().strip()
                    if content.isdigit():
                        start_counter = int(content) + 1
            except Exception:
                pass

        current_num = start_counter
        tag_prefix = quote("♾️ULTRA-TITAN-SRV-")

        # ۱. شماره‌گذاری هیستریا
        final_hy2 = []
        for cfg in cleaned_hy2:
            final_hy2.append(f"{cfg}#{tag_prefix}{current_num}")
            current_num += 1

        # ۲. شماره‌گذاری متوالی ویلس و تروجان
        final_vless_trojan = []
        for cfg in cleaned_vless_trojan:
            final_vless_trojan.append(f"{cfg}#{tag_prefix}{current_num}")
            current_num += 1

        # ذخیره فایل‌ها
        with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(final_hy2) + ("\n" if final_hy2 else ""))

        with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(final_vless_trojan) + ("\n" if final_vless_trojan else ""))

        # به‌روزرسانی کانتر
        total_configs = len(final_hy2) + len(final_vless_trojan)
        last_saved_num = current_num - 1 if total_configs > 0 else (start_counter - 1 if start_counter > 1 else 0)

        with open(counter_file, "w", encoding="utf-8") as f:
            f.write(str(last_saved_num))

        print(f"\n🎉 فایل hy2_filtered.txt آماده شد ({len(final_hy2)} کانفیگ).")
        print(f"🎉 فایل vless_trojan_filtered.txt آماده شد ({len(final_vless_trojan)} کانفیگ).")
        print(f"🔢 شماره‌گذاری از {start_counter} تا {last_saved_num} ثبت گردید.")

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt
          git diff --staged --quiet || git commit -m "Auto-update configurations $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
