name: StealthyStream Multi-Source Aggregators

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch, Ping-Check, Deduplicate and Normalize Configs
        run: |
          python - << 'EOF'
          import urllib.request
          import urllib.parse
          import os
          import re
          import socket
          from concurrent.futures import ThreadPoolExecutor

          # منابع آنلاین استخراج کانفیگ
          urls = [
              "https://raw.githubusercontent.com/v2go/v2ray-configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/hysteria",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/vless",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-configs-collector/main/protocols/trojan"
          ]

          raw_lines = []

          # ۱. خواندن کانفیگ‌های دستی اختصاصی از custom.txt
          if os.path.exists("custom.txt"):
              try:
                  with open("custom.txt", "r", encoding="utf-8") as f:
                      custom_lines = f.read().splitlines()
                      print(f"📦 Loaded {len(custom_lines)} custom configurations from custom.txt")
                      raw_lines.extend(custom_lines)
              except Exception as e:
                  print(f"⚠️ Error reading custom.txt: {e}")

          # ۲. دریافت کانفیگ‌ها از منابع آنلاین
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      content = response.read().decode('utf-8', errors='ignore')
                      fetched = content.splitlines()
                      print(f"✅ Successfully fetched {len(fetched)} lines from {url}")
                      raw_lines.extend(fetched)
              except Exception as e:
                  print(f"❌ Failed to fetch from {url}: {e}")

          # تابع تست باز بودن پورت و زنده بودن سرور (TCP Ping)
          def is_server_alive(target):
              host, port = target
              try:
                  with socket.create_connection((host, int(port)), timeout=1.2):
                      return True
              except Exception:
                  return False

          seen_keys = set()
          parsed_candidates = []

          # ۳. پارس اولیه، حذف کاراکترهای ناامن و کلید یکتا
          for line in raw_lines:
              line = line.strip()
              if not line:
                  continue

              line_lower = line.lower()
              # حذف گواهی‌های نامعتبر و ناامن
              if "insecure=1" in line_lower or "allowinsecure=1" in line_lower or "allowinsecure=true" in line_lower:
                  continue

              try:
                  parsed = urllib.parse.urlsplit(line)
                  proto = parsed.scheme.lower()
                  if proto not in ("hysteria2", "hy2", "vless", "trojan"):
                      continue

                  host = parsed.hostname
                  port = parsed.port
                  if not host or not port:
                      continue

                  user_info = parsed.username or ""
                  query_dict = urllib.parse.parse_qs(parsed.query)
                  sni = query_dict.get('sni', [''])[0] or query_dict.get('peer', [''])[0]

                  # ساخت کلید یکتا برای حذف تکراری‌ها در مبدا
                  unique_key = f"{proto}:{user_info}@{host}:{port}:{sni}"
                  if unique_key in seen_keys:
                      continue

                  seen_keys.add(unique_key)
                  base_url = urllib.parse.urlunsplit((parsed.scheme, parsed.netloc, parsed.path, parsed.query, ''))
                  parsed_candidates.append({
                      'proto': proto,
                      'host': host,
                      'port': port,
                      'base_url': base_url
                  })
              except Exception:
                  continue

          print(f"\n🔍 Unique configs found: {len(parsed_candidates)}. Starting multi-threaded ping check...")

          # ۴. تست پینگ موازی روی سرورها با ThreadPool (فوق‌سریع)
          unique_targets = list({(item['host'], item['port']) for item in parsed_candidates})
          alive_targets = set()

          with ThreadPoolExecutor(max_workers=60) as executor:
              results = executor.map(is_server_alive, unique_targets)
              for target, is_alive in zip(unique_targets, results):
                  if is_alive:
                      alive_targets.add(target)

          print(f"⚡ Alive & Open-port endpoints: {len(alive_targets)} / {len(unique_targets)}")

          # ۵. مدیریت شمارنده
          counter = 1
          if os.path.exists("counter.txt"):
              try:
                  with open("counter.txt", "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content.isdigit():
                          counter = int(content)
              except Exception as e:
                  print(f"⚠️ Error reading counter.txt: {e}")

          hy2_output = []
          vless_output = []
          trojan_output = []

          # ۶. اعمال فقط کانفیگ‌های زنده و برچسب‌گذاری
          for item in parsed_candidates:
              if (item['host'], item['port']) not in alive_targets:
                  continue

              proto = item['proto']
              base_url = item['base_url']

              if proto in ("hysteria2", "hy2"):
                  tag = urllib.parse.quote(f"♾️ULTRA-TITAN-SRV-{counter}")
                  hy2_output.append(f"{base_url}#{tag}")
                  counter += 1
              elif proto == "vless":
                  tag = urllib.parse.quote(f"♾️ULTRA-TITAN-SRVT-{counter}")
                  vless_output.append(f"{base_url}#{tag}")
                  counter += 1
              elif proto == "trojan":
                  tag = urllib.parse.quote(f"♾️ULTRA-TITAN-SRVT-{counter}")
                  trojan_output.append(f"{base_url}#{tag}")
                  counter += 1

          # ذخیره فایل‌های خروجی گلچین‌شده
          with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(hy2_output) + ("\n" if hy2_output else ""))

          with open("vless_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(vless_output) + ("\n" if vless_output else ""))

          with open("trojan_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(trojan_output) + ("\n" if trojan_output else ""))

          with open("counter.txt", "w", encoding="utf-8") as f:
              f.write(str(counter))

          print(f"✨ Finished! Saved {len(hy2_output)} Hy2, {len(vless_output)} VLESS, and {len(trojan_output)} Trojan alive configs.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hy2_filtered.txt vless_filtered.txt trojan_filtered.txt counter.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: ping-checked & deduplicated configs"
            git push origin HEAD:${{ github.ref }}
          fi
