name: StealthyStream Multi-Source Aggregator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stealthystream-updater
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # ═══════════════════════════════════════════════════════
      #  ●  دریافت مخزن
      # ═══════════════════════════════════════════════════════
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════
      #  ●  آماده‌سازی پایتون
      # ═══════════════════════════════════════════════════════
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ═══════════════════════════════════════════════════════
      #  ●  نصب وابستگی‌ها
      # ═══════════════════════════════════════════════════════
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ═══════════════════════════════════════════════════════
      #  ●  دریافت، پالایش و ذخیره اولیه کانفیگ‌ها
      # ═══════════════════════════════════════════════════════
      - name: Fetch, Deduplicate and Normalize Configs
        run: |
          python - << 'PYEOF'

          # ═══════════════════════════════════════════════════════
          #  ●  ۱. کتابخانه‌ها
          # ═══════════════════════════════════════════════════════
          import os
          import re
          import html
          import base64
          import ipaddress
          import sys
          import time
          import requests
          from urllib.parse import urlparse, parse_qs, quote
          from requests.adapters import HTTPAdapter
          try:
              from urllib3.util.retry import Retry
          except ImportError:
              from requests.packages.urllib3.util.retry import Retry


          # ═══════════════════════════════════════════════════════
          #  ●  ۲. منابع (دریافت از گیت‌هاب و تلگرام)
          # ═══════════════════════════════════════════════════════
          
          # ─── منابع گیت‌هاب ───
          GITHUB_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/splitted/vless",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs_tested.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt",
              "https://ogy.de/oneclickvpnkeys-free-sub",
              "https://raw.githubusercontent.com/arshiacomplus/v2rayExtractor/refs/heads/main/mix/sub.html",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",
              "https://raw.githubusercontent.com/kasesm/Free-Config/refs/heads/main/all_raw.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt"
          ]

          # ─── منابع تلگرام ───
          TELEGRAM_CHANNELS = [
              "prrofile_purple",
              "mehrosaboran",
              "persianvpnhub",
              "daily_configs",
              "allproconf",
              "vpnplusee_free",
              "oneclickvpnkeys",
              "ConfigV2rayNG",
              "V2rayuir",
              "v2ray_dalghak1",
              "proxy_kafee",
              "FreakConfig",
              "VmessProtocol",
              "v2rayNG_Matsuri",
              "VpnProxy4free",
              "PrivateVPNs",
              "free1_vpn",
              "ConfigYab_FREE",
              "makvaslim"
          ]

          # ═══════════════════════════════════════════════════════
          #  ●  ۳. تنظیمات
          # ═══════════════════════════════════════════════════════
          TIMEOUT = 15
          MAX_BYTES = 5_000_000
          CHANNEL_SLEEP = 0.4

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/122.0.0.0 Safari/537.36"
              )
          }

          HY2_PROTOCOLS = ("hysteria2://", "hysteria://", "hy2://")
          VLESS_TROJAN_PROTOCOLS = ("vless://", "trojan://", "tuic://", "warp://")
          ALL_PROTOCOLS = HY2_PROTOCOLS + VLESS_TROJAN_PROTOCOLS
          FULL_TEXT_PROTOCOLS = {"warp", "tuic"}

          UNSAFE_PATTERNS = (
              "insecure=1",
              "insecure=true",
              "allowinsecure=1",
              "allowinsecure=true",
              "skip-cert-verify=1",
              "skip-cert-verify=true",
              "tlsinsecure=1",
              "tlsinsecure=true",
              "mitm",
              "@127.0.0.1:",
              "@localhost:",
              "@0.0.0.0:",
          )

          CONFIG_REGEX = re.compile(
              r'(?:vless|trojan|tuic|warp|hysteria2|hysteria|hy2)://[^\s<>"\'`]+',
              re.IGNORECASE,
          )


          # ═══════════════════════════════════════════════════════
          #  ●  ۴. ذخیره‌سازی موقت
          # ═══════════════════════════════════════════════════════
          raw_hy2_items = []
          raw_vless_trojan_items = []


          # ═══════════════════════════════════════════════════════
          #  ●  ۵. نشست HTTP
          # ═══════════════════════════════════════════════════════
          session = requests.Session()
          session.headers.update(HEADERS)
          _retry = Retry(
              total=3,
              backoff_factor=1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=["GET"],
          )
          _adapter = HTTPAdapter(max_retries=_retry)
          session.mount("https://", _adapter)
          session.mount("http://", _adapter)


          # ═══════════════════════════════════════════════════════
          #  ●  ۶. توابع کمکی
          # ═══════════════════════════════════════════════════════
          def file_non_empty(path):
              if not os.path.exists(path):
                  return False
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return any(l.strip() for l in f)
              except Exception:
                  return False


          def decode_if_base64(text):
              stripped = text.strip()
              if not stripped:
                  return text
              if any(p in stripped for p in ALL_PROTOCOLS):
                  return text

              pad = "=" * ((4 - len(stripped) % 4) % 4)
              for cand in (stripped, stripped + pad):
                  for decoder in (base64.b64decode, base64.urlsafe_b64decode):
                      try:
                          decoded = decoder(cand, validate=False).decode(
                              "utf-8", errors="ignore"
                          )
                      except Exception:
                          continue
                      if any(p in decoded for p in ALL_PROTOCOLS):
                          return decoded
              return text


          def is_private_or_invalid_host(host):
              host = (host or "").strip("[]").strip().lower()
              if not host:
                  return True
              if host in {"localhost", "0.0.0.0", "::", "::1"}:
                  return True
              if host.endswith(".local") or host.endswith(".localhost"):
                  return True
              try:
                  ip = ipaddress.ip_address(host)
              except ValueError:
                  return False
              return (
                  ip.is_private
                  or ip.is_loopback
                  or ip.is_link_local
                  or ip.is_multicast
                  or ip.is_reserved
                  or ip.is_unspecified
              )


          def split_host_port(netloc):
              if netloc.startswith("["):
                  end = netloc.find("]")
                  if end != -1:
                      host = netloc[1:end]
                      port = netloc[end + 1:].lstrip(":") or "443"
                      return host, port
              if ":" in netloc:
                  host, port = netloc.rsplit(":", 1)
                  return host, (port or "443")
              return netloc, "443"


          def has_unsafe_pattern(url_part):
              low = url_part.lower()
              return any(p in low for p in UNSAFE_PATTERNS)


          def build_dedup_key(line):
              try:
                  parsed = urlparse(line)
              except Exception:
                  return None

              protocol = (parsed.scheme or "").lower()
              if not protocol:
                  return None

              if protocol in {"hy2", "hysteria", "hysteria2"}:
                  protocol = "hysteria2"

              base_config = line.split("#", 1)[0].strip()

              if protocol in FULL_TEXT_PROTOCOLS:
                  return (protocol, base_config)

              if not parsed.netloc:
                  return None

              if "@" in parsed.netloc:
                  user_info = parsed.netloc.rsplit("@", 1)[0]
                  netloc = parsed.netloc.rsplit("@", 1)[1]
              else:
                  user_info = ""
                  netloc = parsed.netloc

              host, port = split_host_port(netloc)
              host = host.lower().strip()

              if is_private_or_invalid_host(host):
                  return None

              q = parse_qs(parsed.query, keep_blank_values=False)

              def qv(*keys):
                  for k in keys:
                      v = q.get(k)
                      if v and v[0]:
                          return v[0].lower().strip()
                  return ""

              return (
                  protocol,
                  user_info,
                  host,
                  port,
                  qv("sni", "serverName", "peer", "server_name"),
                  qv("type", "net"),
                  qv("path", "serviceName", "service_name"),
                  qv("host"),
                  qv("pbk", "publicKey", "public_key"),
                  qv("sid", "shortId", "short_id"),
                  qv("flow"),
                  qv("security"),
                  qv("fp"),
                  qv("alpn"),
                  qv("mode"),
                  qv("headerType"),
                  qv("spx"),
              )


          # ═══════════════════════════════════════════════════════
          #  ●  ۷. دریافت‌کننده‌ها
          # ═══════════════════════════════════════════════════════
          def fetch_mixed_urls(urls, label):
              for raw_url in urls:
                  url = raw_url.split("#")[0].strip()
                  if not url:
                      continue
                  try:
                      r = session.get(url, timeout=TIMEOUT)
                      if r.status_code != 200:
                          print(f"⚠️  [{label}] HTTP {r.status_code}: {url}")
                          continue
                      if len(r.content) > MAX_BYTES:
                          print(f"⚠️  [{label}] حجم بیش از حد: {url}")
                          continue

                      content = decode_if_base64(r.text)
                      lines = content.replace("\r", "").split("\n")

                      hy2_added = 0
                      other_added = 0
                      seen_in_source = set()

                      for line in lines:
                          s = line.strip()
                          if not s or s in seen_in_source:
                              continue
                          
                          low = s.lower()
                          if low.startswith(HY2_PROTOCOLS):
                              seen_in_source.add(s)
                              raw_hy2_items.append(s)
                              hy2_added += 1
                          elif low.startswith(VLESS_TROJAN_PROTOCOLS):
                              seen_in_source.add(s)
                              raw_vless_trojan_items.append(s)
                              other_added += 1

                      print(f"✅ [{label}] Hy2: +{hy2_added} | Other: +{other_added}  ←  {url}")
                  except Exception as e:
                      print(f"❌ [{label}] خطا در {url}: {e}")


          def fetch_telegram_channels(channels):
              print("\n📡 استخراج از کانال‌های تلگرام آغاز شد.")
              for channel in channels:
                  name = (
                      channel.strip()
                      .replace("https://t.me/", "")
                      .replace("@", "")
                      .split("/")[0]
                  )
                  if not name:
                      continue

                  url = f"https://t.me/s/{name}"
                  try:
                      r = session.get(url, timeout=TIMEOUT)
                      if r.status_code != 200:
                          print(f"⚠️  @{name}: HTTP {r.status_code}")
                          time.sleep(CHANNEL_SLEEP)
                          continue

                      text = re.sub(
                          r'</?(?:div|br|p|blockquote|pre|code|hr|li|tr|td|th|h[1-6])[^>]*>',
                          '\n',
                          r.text,
                          flags=re.IGNORECASE,
                      )
                      text = re.sub(r'<[^>]+>', '', text)
                      text = html.unescape(text)

                      configs = CONFIG_REGEX.findall(text)

                      hy2_count = 0
                      other_count = 0
                      seen = set()

                      for cfg in configs:
                          c = cfg.strip().rstrip('.,;()[]{}\'"')
                          if not c or c in seen:
                              continue
                          seen.add(c)
                          low = c.lower()
                          if low.startswith(HY2_PROTOCOLS):
                              raw_hy2_items.append(c)
                              hy2_count += 1
                          elif low.startswith(VLESS_TROJAN_PROTOCOLS):
                              raw_vless_trojan_items.append(c)
                              other_count += 1

                      print(f"✅ @{name}: Hy2={hy2_count} | Other={other_count}")
                  except Exception as e:
                      print(f"❌ @{name}: {e}")
                  finally:
                      time.sleep(CHANNEL_SLEEP)


          # ═══════════════════════════════════════════════════════
          #  ●  ۸. بارگذاری فایل دستی
          # ═══════════════════════════════════════════════════════
          if os.path.exists("custom.txt"):
              try:
                  with open("custom.txt", "r", encoding="utf-8") as f:
                      for line in f.read().replace("\r", "").split("\n"):
                          s = line.strip()
                          if not s:
                              continue
                          low = s.lower()
                          if low.startswith(HY2_PROTOCOLS):
                              raw_hy2_items.append(s)
                          elif low.startswith(VLESS_TROJAN_PROTOCOLS):
                              raw_vless_trojan_items.append(s)
                  print("✅ custom.txt بارگذاری شد.")
              except Exception as e:
                  print(f"❌ خطا در خواندن custom.txt: {e}")


          # ═══════════════════════════════════════════════════════
          #  ●  ۹. اجرای دریافت‌کننده‌ها
          # ═══════════════════════════════════════════════════════
          
          # 💡 برای غیرفعال کردن گیت‌هاب، ابتدای خط زیر # بگذارید
          # fetch_mixed_urls(GITHUB_PUBLIC_URLS, "GitHub")
          
          # 💡 برای غیرفعال کردن تلگرام، ابتدای خط زیر # بگذارید
          fetch_telegram_channels(TELEGRAM_CHANNELS)


          # ═══════════════════════════════════════════════════════
          #  ●  ۱۰. پالایش و یکتاسازی
          # ═══════════════════════════════════════════════════════
          print("\n🔍 پالایش و یکتاسازی آغاز شد.")

          seen_keys = set()

          def clean_and_dedup(raw_list, label):
              out = []
              dropped_unsafe = 0
              dropped_invalid = 0
              dropped_dup = 0
              dropped_vmess = 0

              for line in raw_list:
                  if not line:
                      continue

                  base = line.split("#", 1)[0].strip()
                  if not base:
                      continue

                  if base[:8].lower() == "vmess://":
                      dropped_vmess += 1
                      continue

                  if has_unsafe_pattern(base):
                      dropped_unsafe += 1
                      continue

                  key = build_dedup_key(line)
                  if key is None:
                      dropped_invalid += 1
                      continue

                  if key in seen_keys:
                      dropped_dup += 1
                      continue

                  seen_keys.add(key)
                  out.append(base)

              print(
                  f"  • {label}: نگه‌داشته={len(out)} | "
                  f"امنیتی={dropped_unsafe} | "
                  f"نامعتبر={dropped_invalid} | "
                  f"تکراری={dropped_dup} | "
                  f"vmess(drop)={dropped_vmess}"
              )
              return out

          cleaned_hy2 = clean_and_dedup(raw_hy2_items, "Hy2")
          cleaned_vless = clean_and_dedup(raw_vless_trojan_items, "VLESS/Other")

          print(f"✨ تعداد یکتای Hy2: {len(cleaned_hy2)}")
          print(f"✨ تعداد یکتای سایر: {len(cleaned_vless)}")


          # ═══════════════════════════════════════════════════════
          #  ●  ۱۱. ذخیرهٔ خروجی‌ها (بدون شماره‌گذاری)
          # ═══════════════════════════════════════════════════════
          if not cleaned_hy2 and not cleaned_vless:
              print("🛑 هیچ کانفیگی دریافت نشد — فایل‌های قبلی حفظ می‌شوند.")
              sys.exit(0)

          if cleaned_hy2 or not file_non_empty("hy2_filtered.txt"):
              with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
                  if cleaned_hy2:
                      f.write("\n".join(cleaned_hy2) + "\n")
              print(f"🎉 hy2_filtered.txt → {len(cleaned_hy2)} کانفیگ (بدون شماره)")
          else:
              print("🛡️ hy2_filtered.txt حفظ شد (اجرای بدون نتیجه).")

          if cleaned_vless or not file_non_empty("vless_trojan_filtered.txt"):
              with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as f:
                  if cleaned_vless:
                      f.write("\n".join(cleaned_vless) + "\n")
              print(f"🎉 vless_trojan_filtered.txt → {len(cleaned_vless)} کانفیگ (بدون شماره)")
          else:
              print("🛡️ vless_trojan_filtered.txt حفظ شد (اجرای بدون نتیجه).")

          PYEOF

      # ═══════════════════════════════════════════════════════
      #  ●  تست زنده و حذف سرورهای مرده با xray-knife
      # ═══════════════════════════════════════════════════════
      - name: Live Test and Filter Dead Servers
        timeout-minutes: 60
        run: |
          # ╔════════════════════════════════════════════════════╗
          # ║  🔘  کلید فعال/غیرفعال کردن تست پینگ           ║
          # ║  ────────────────────────────────────────────────  ║
          # ║  برای غیرفعال کردن تست، این مقدار را false کنید.   ║
          # ╚════════════════════════════════════════════════════╝
          ENABLE_PING_TEST=true

          if [ "${ENABLE_PING_TEST:-false}" != "true" ]; then
            echo "⏸️  تست پینگ غیرفعال شد — فایل‌ها دست‌نخورده می‌مانند."
            exit 0
          fi

          echo "🔧 نصب هسته Xray..."
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install || { echo "❌ نصب Xray ناموفق — فایل‌ها بدون فیلتر commit می‌شوند."; exit 0; }

          echo "📥 دریافت xray-knife..."
          KNIFE_URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | grep -o '"browser_download_url": *"[^"]*linux-64[^"]*"' | cut -d '"' -f 4 | head -n 1)
          if [ -z "$KNIFE_URL" ]; then
            echo "❌ لینک دانلود پیدا نشد — فایل‌ها بدون فیلتر commit می‌شوند."
            exit 0
          fi
          wget -q "$KNIFE_URL" -O knife.zip && unzip -q -o knife.zip && chmod +x xray-knife || { echo "❌ آماده‌سازی xray-knife ناموفق — فایل‌ها بدون فیلتر commit می‌شوند."; exit 0; }

          # ────────────────────────────────────────────────────────
          # تست Hy2 (خروجی CSV برای مرتب‌سازی بر اساس سرعت)
          # ────────────────────────────────────────────────────────
          if [ -s hy2_filtered.txt ]; then
            echo "🧪 تست Hy2 (بدون محدودیت تعداد، خروجی CSV برای مرتب‌سازی سرعت)..."
            ./xray-knife http -f hy2_filtered.txt \
              --prescan \
              --prescan-timeout 4000 \
              --prescan-workers 20 \
              --mdelay 2000 \
              -t 10 \
              --speedtest \
              --amount 2 \
              --speedtest-timeout 10 \
              --type csv \
              -o hy2_results.csv || true

            if [ -f hy2_results.csv ]; then
              python3 - << 'PYEOF'
import csv, os
n = 30
rows = []
with open('hy2_results.csv') as f:
    reader = csv.DictReader(f)
    for row in reader:
        if row.get('status') == 'passed':
            rows.append(row)
rows.sort(key=lambda x: float(x.get('download', 0) or 0), reverse=True)
with open('hy2_alive.txt', 'w') as f:
    for row in rows[:n]:
        f.write(row['link'] + '\n')
print(f"✅ {len(rows[:n])} کانفیگ Hy2 بر اساس سرعت انتخاب شد.")
PYEOF
              if [ -s hy2_alive.txt ]; then
                mv hy2_alive.txt hy2_filtered.txt
                echo "✅ hy2_filtered.txt با بهترین‌های Hy2 به‌روز شد."
              else
                echo "🛡️ hy2_alive.txt خالی است — فایل قبلی Hy2 حفظ شد."
              fi
            else
              echo "🛡️ hy2_results.csv ساخته نشد — فایل قبلی Hy2 حفظ شد."
            fi
          else
            echo "⚠️ فایل hy2_filtered.txt خالی است — از تست Hy2 عبور شد."
          fi

          # ────────────────────────────────────────────────────────
          # تست VLESS/Trojan (خروجی CSV برای مرتب‌سازی بر اساس سرعت)
          # ────────────────────────────────────────────────────────
          if [ -s vless_trojan_filtered.txt ]; then
            echo "🧪 تست VLESS/Trojan (بدون محدودیت تعداد، خروجی CSV برای مرتب‌سازی سرعت)..."
            ./xray-knife http -f vless_trojan_filtered.txt \
              --prescan \
              --prescan-timeout 4000 \
              --prescan-workers 20 \
              --mdelay 2000 \
              -t 10 \
              --speedtest \
              --amount 2 \
              --speedtest-timeout 10 \
              --type csv \
              -o vless_results.csv || true

            if [ -f vless_results.csv ]; then
              python3 - << 'PYEOF'
import csv, os
n = 30
rows = []
with open('vless_results.csv') as f:
    reader = csv.DictReader(f)
    for row in reader:
        if row.get('status') == 'passed':
            rows.append(row)
rows.sort(key=lambda x: float(x.get('download', 0) or 0), reverse=True)
with open('vless_alive.txt', 'w') as f:
    for row in rows[:n]:
        f.write(row['link'] + '\n')
print(f"✅ {len(rows[:n])} کانفیگ VLESS/Trojan بر اساس سرعت انتخاب شد.")
PYEOF
              if [ -s vless_alive.txt ]; then
                mv vless_alive.txt vless_trojan_filtered.txt
                echo "✅ vless_trojan_filtered.txt با بهترین‌های VLESS/Trojan به‌روز شد."
              else
                echo "🛡️ vless_alive.txt خالی است — فایل قبلی VLESS حفظ شد."
              fi
            else
              echo "🛡️ vless_results.csv ساخته نشد — فایل قبلی VLESS حفظ شد."
            fi
          else
            echo "⚠️ فایل vless_trojan_filtered.txt خالی است — از تست VLESS عبور شد."
          fi

      # ═══════════════════════════════════════════════════════
      #  ●  شماره‌گذاری نهایی و ذخیره شمارنده
      # ═══════════════════════════════════════════════════════
      - name: Numbering and Save Counter
        run: |
          python - << 'PYEOF'
          import os
          from urllib.parse import quote

          counter_file = "counter.txt"
          start_counter = 1

          if os.path.exists(counter_file):
              try:
                  with open(counter_file, "r", encoding="utf-8") as f:
                      txt = f.read().strip()
                  if txt.isdigit():
                      start_counter = int(txt) + 1
              except Exception:
                  pass

          tag_prefix = quote("⚡ULTRA-TITAN-SRV-")
          current_number = start_counter

          def number_file(filename):
              global current_number
              if not os.path.exists(filename):
                  return
              with open(filename, "r", encoding="utf-8") as f:
                  lines = [l.strip() for l in f if l.strip()]
              
              if not lines:
                  return

              out_lines = []
              for cfg in lines:
                  base = cfg.split("#", 1)[0].strip()
                  out_lines.append(f"{base}#{tag_prefix}{current_number}")
                  current_number += 1
                  
              with open(filename, "w", encoding="utf-8") as f:
                  f.write("\n".join(out_lines) + "\n")
              print(f"🏷️ {filename} → شماره‌گذاری شد ({len(out_lines)} کانفیگ)")

          number_file("vless_trojan_filtered.txt")
          number_file("hy2_filtered.txt")

          if current_number > start_counter:
              last_saved = current_number - 1
          elif start_counter > 1:
              last_saved = start_counter - 1
          else:
              last_saved = 0

          with open(counter_file + ".tmp", "w", encoding="utf-8") as f:
              f.write(str(last_saved))
          os.replace(counter_file + ".tmp", counter_file)

          print(f"🔢 شماره‌گذاری نهایی: {start_counter} → {last_saved}")
          PYEOF

      # ═══════════════════════════════════════════════════════
      #  ●  ثبت و ارسال تغییرات
      # ═══════════════════════════════════════════════════════
      - name: Commit and Push Changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt

          if git diff --cached --quiet; then
            echo "ℹ️  تغییری برای commit وجود ندارد."
            exit 0
          fi

          HY2_COUNT=$( [ -f hy2_filtered.txt ] && wc -l < hy2_filtered.txt || echo 0 )
          VLESS_COUNT=$( [ -f vless_trojan_filtered.txt ] && wc -l < vless_trojan_filtered.txt || echo 0 )

          git commit -m "Update configs (hy2=${HY2_COUNT}, vless=${VLESS_COUNT}) [CI]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push