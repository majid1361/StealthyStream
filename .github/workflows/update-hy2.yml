name: StealthyStream Multi-Source Aggregator

on:
  schedule:
    # اجرا هر ۶ ساعت یک‌بار (ساعت 00:00, 06:00, 12:00, 18:00 به وقت UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی با دکمه Run workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch, Deduplicate and Normalize Configs
        run: |
          python - << 'EOF'
          import os
          import re
          import requests
          from urllib.parse import urlparse, parse_qs, quote

          # ۱. سورس‌های عمومی هیستریا (Hysteria 1 & 2)
          HY2_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_extracted_configs.txt",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt",
              "https://ogy.de/oneclickvpnkeys-free-sub",
              "https://raw.githubusercontent.com/arshiacomplus/v2rayExtractor/refs/heads/main/mix/sub.html",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs_tested.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          # ۲. سورس‌های جدید اختصاصی VLESS و TROJAN
          VLESS_TROJAN_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",
              "https://raw.githubusercontent.com/kasesm/Free-Config/refs/heads/main/all_raw.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt"
          ]

          TIMEOUT = 15
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          HY2_PROTOCOLS = ("hysteria2://", "hysteria://", "hy2://")
          VLESS_TROJAN_PROTOCOLS = ("vless://", "trojan://")

          raw_hy2_items = []
          raw_vless_trojan_items = []

          print("📥 در حال دریافت کانفیگ‌ها از منابع...")

          # خواندن فایل کاستوم (تفکیک هوشمند ۲ زمانه)
          if os.path.exists("custom.txt"):
              try:
                  with open("custom.txt", "r", encoding="utf-8") as f:
                      lines = f.read().replace('\r', '').split('\n')
                      for line in lines:
                          line_clean = line.strip()
                          if line_clean.startswith(HY2_PROTOCOLS):
                              raw_hy2_items.append(line_clean)
                          elif line_clean.startswith(VLESS_TROJAN_PROTOCOLS):
                              raw_vless_trojan_items.append(line_clean)
                  print("✅ موفق: custom.txt خوانده و با موفقیت تفکیک شد.")
              except Exception as e:
                  print(f"❌ خطا در خواندن custom.txt -> {e}")

          # تابع کمکی برای دانلود ایمن و استخراج خطوط
          def fetch_urls(urls, target_protocols, target_list, label):
              for raw_url in urls:
                  url = raw_url.split('#')[0].strip() # حذف تر و تمیز تگ‌های احتمالی در انتهای URL
                  try:
                      res = requests.get(url, headers=HEADERS, timeout=TIMEOUT)
                      if res.status_code == 200:
                          lines = res.text.replace('\r', '').split('\n')
                          count = 0
                          for line in lines:
                              line_clean = line.strip()
                              if line_clean.startswith(target_protocols):
                                  target_list.append(line_clean)
                                  count += 1
                          print(f"✅ موفق ({label}): {url} [استخراج شد: {count}]")
                      else:
                          print(f"⚠️ کد وضعیت ناموفق ({res.status_code}): {url}")
                  except Exception as e:
                      print(f"❌ خطا در دانلود ({label}): {url} -> {e}")

          # ۱. دریافت هیستریا از سورس‌های پابلیک
          fetch_urls(HY2_PUBLIC_URLS, HY2_PROTOCOLS, raw_hy2_items, "Hy2")

          # ۲. دریافت Vless و Trojan از سورس‌های جدید
          fetch_urls(VLESS_TROJAN_PUBLIC_URLS, VLESS_TROJAN_PROTOCOLS, raw_vless_trojan_items, "Vless/Trojan")

          # تابع فیلتر امنیتی و یکتا‌سازی مهندسی‌شده (Deduplication)
          seen_keys = set()
          def process_and_dedup(raw_list):
              cleaned = []
              for line in raw_list:
                  # فیلتر کردن کانفیگ‌های ناامن (جلوگیری از MITM)
                  line_lower = line.lower()
                  if "insecure=1" in line_lower or "allowinsecure=1" in line_lower or "allowinsecure=true" in line_lower:
                      continue

                  try:
                      parsed = urlparse(line)
                      user_info = parsed.netloc.rsplit('@', 1)[0] if '@' in parsed.netloc else ''
                      netloc = parsed.netloc.split('@')[-1]

                      if ':' in netloc:
                          host, port = netloc.split(':', 1)
                      else:
                          host, port = netloc, '443'

                      host = host.lower().strip()
                      port = port.strip()

                      query_params = parse_qs(parsed.query)
                      sni = query_params.get('sni', [''])[0].lower().strip()

                      proto = parsed.scheme.lower()
                      unique_key = f"{proto}:{user_info}:{host}:{port}:{sni}"

                      if unique_key not in seen_keys:
                          seen_keys.add(unique_key)
                          base_config = line.split('#')[0].strip()
                          cleaned.append(base_config)
                  except Exception:
                      continue
              return cleaned

          print("\n🔍 در حال فیلتر، اعتبارسنجی و حذف تکراری‌ها...")
          cleaned_hy2 = process_and_dedup(raw_hy2_items)
          cleaned_vless_trojan = process_and_dedup(raw_vless_trojan_items)

          print(f"✨ تعداد هیستریا یکتا و سالم: {len(cleaned_hy2)}")
          print(f"✨ تعداد ویلس و تروجان یکتا و سالم: {len(cleaned_vless_trojan)}")

          # مدیریت کانتر یکپارچه (Monotonic Sequence)
          counter_file = "counter.txt"
          start_counter = 1
          if os.path.exists(counter_file):
              try:
                  with open(counter_file, "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content.isdigit():
                          start_counter = int(content) + 1
              except Exception:
                  pass

          current_num = start_counter
          tag_prefix = quote("♾️ULTRA-TITAN-SRV-")

          # ۱. شماره‌گذاری هیستریا
          final_hy2 = []
          for cfg in cleaned_hy2:
              final_hy2.append(f"{cfg}#{tag_prefix}{current_num}")
              current_num += 1

          # ۲. شماره‌گذاری پیوسته Vless و Trojan (دقیقاً پشت سر هیستریا بدون پرش)
          final_vless_trojan = []
          for cfg in cleaned_vless_trojan:
              final_vless_trojan.append(f"{cfg}#{tag_prefix}{current_num}")
              current_num += 1

          # ذخیره فایل‌های نهایی
          with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_hy2) + ("\n" if final_hy2 else ""))

          with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_vless_trojan) + ("\n" if final_vless_trojan else ""))

          # ذخیره آخرین شماره ثبت‌شده در کانتر سراسری
          total_configs = len(final_hy2) + len(final_vless_trojan)
          last_saved_num = current_num - 1 if total_configs > 0 else (start_counter - 1 if start_counter > 1 else 0)

          with open(counter_file, "w", encoding="utf-8") as f:
              f.write(str(last_saved_num))

          print(f"\n🎉 فایل hy2_filtered.txt با {len(final_hy2)} کانفیگ آماده شد.")
          print(f"🎉 فایل vless_trojan_filtered.txt با {len(final_vless_trojan)} کانفیگ آماده شد.")
          print(f"🔢 شماره‌گذاری از {start_counter} تا {last_saved_num} به شکل پیوسته ذخیره شد.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hy2 & Vless/Trojan configs [skip ci]" && git push)
