name: StealthyStream Multi-Source Aggregator

on:
  schedule:
    # اجرا هر ۶ ساعت یک‌بار (ساعت 00:00, 06:00, 12:00, 18:00 به وقت UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی با دکمه Run workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch, Deduplicate and Normalize Configs
        run: |
          python - << 'EOF'
          import os
          import re
          import requests
          from urllib.parse import urlparse, parse_qs, quote

          PUBLIC_URLS = [
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_extracted_configs.txt",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt",
              "https://ogy.de/oneclickvpnkeys-free-sub",
              "https://raw.githubusercontent.com/arshiacomplus/v2rayExtractor/refs/heads/main/mix/sub.html",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs_tested.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          VT_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",
              "https://raw.githubusercontent.com/kasesm/Free-Config/refs/heads/main/all_raw.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt"
          ]

          TIMEOUT = 15
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          raw_items = []
          vt_raw_items = []

          print("📥 در حال دریافت کانفیگ‌ها از منابع جدید...")
          # ۱. خواندن فایل کاستوم خودت (با تفکیک پروتکل‌ها)
          if os.path.exists("custom.txt"):
              try:
                  with open("custom.txt", "r", encoding="utf-8") as f:
                      lines = f.read().replace('\r', '').split('\n')
                      for line in lines:
                          raw_items.append((line, True))
                          vt_raw_items.append((line, True))
                  print("✅ موفق: custom.txt")
              except Exception as e:
                  print(f"❌ خطا در خواندن custom.txt -> {e}")

          # ۲. خواندن سورس‌های عمومی هیستریا
          for url in PUBLIC_URLS:
              try:
                  clean_url = url.split('#')[0].strip()
                  res = requests.get(clean_url, headers=HEADERS, timeout=TIMEOUT)
                  if res.status_code == 200:
                      lines = res.text.replace('\r', '').split('\n')
                      for line in lines:
                          raw_items.append((line, False))
                      print(f"✅ موفق: {url}")
                  else:
                      print(f"⚠️ کد وضعیت ناموفق ({res.status_code}): {url}")
              except Exception as e:
                  print(f"❌ خطا در دانلود: {url} -> {e}")

          # ۳. خواندن سورس‌های عمومی VLESS و Trojan
          print("\n📥 در حال دریافت کانفیگ‌های VLESS و Trojan...")
          for url in VT_PUBLIC_URLS:
              try:
                  clean_url = url.split('#')[0].strip()
                  res = requests.get(clean_url, headers=HEADERS, timeout=TIMEOUT)
                  if res.status_code == 200:
                      lines = res.text.replace('\r', '').split('\n')
                      for line in lines:
                          vt_raw_items.append((line, False))
                      print(f"✅ موفق: {url}")
                  else:
                      print(f"⚠️ کد وضعیت ناموفق ({res.status_code}): {url}")
              except Exception as e:
                  print(f"❌ خطا در دانلود: {url} -> {e}")

          # ==================== پردازش لاین ۱: Hysteria ====================
          seen_keys = set()
          cleaned_configs = []

          PUBLIC_PROTOCOLS = ("hysteria2://", "hysteria://", "hy2://")
          CUSTOM_PROTOCOLS = ("hysteria2://", "hysteria://", "hy2://")

          print("\n🔍 در حال بررسی، فیلتر و حذف موارد تکراری Hysteria...")
          for line, is_custom in raw_items:
              line = line.strip()
              allowed = CUSTOM_PROTOCOLS if is_custom else PUBLIC_PROTOCOLS
              if not line.startswith(allowed): continue

              # فیلتر کردن کانفیگ‌های ناامن (حذف اخطارهای SSL و خطرات MITM)
              line_lower = line.lower()
              if "insecure=1" in line_lower or "allowinsecure=1" in line_lower or "allowinsecure=true" in line_lower:
                  continue

              try:
                  parsed = urlparse(line)
                  user_info = parsed.netloc.rsplit('@', 1)[0] if '@' in parsed.netloc else ''
                  netloc = parsed.netloc.split('@')[-1]
                  
                  if ':' in netloc:
                      host, port = netloc.split(':', 1)
                  else:
                      host, port = netloc, '443'
                  
                  host = host.lower().strip()
                  port = port.strip()

                  query_params = parse_qs(parsed.query)
                  sni = query_params.get('sni', [''])[0].lower().strip()

                  proto = parsed.scheme.lower()
                  unique_key = f"{proto}:{user_info}:{host}:{port}:{sni}"

                  if unique_key not in seen_keys:
                      seen_keys.add(unique_key)
                      base_config = line.split('#')[0].strip()
                      cleaned_configs.append(base_config)

              except Exception:
                  continue

          print(f"✨ تعداد کل کانفیگ‌های یکتای هیستریا: {len(cleaned_configs)}")

          # ==================== پردازش لاین ۲: VLESS / Trojan ====================
          vt_seen_keys = set()
          vt_cleaned_configs = []
          VT_ALLOWED_PROTOCOLS = ("vless://", "trojan://")

          print("\n🔍 در حال بررسی، فیلتر و حذف موارد تکراری VLESS و Trojan...")
          for line, is_custom in vt_raw_items:
              line = line.strip()
              if not line.startswith(VT_ALLOWED_PROTOCOLS): continue

              line_lower = line.lower()
              if "insecure=1" in line_lower or "allowinsecure=1" in line_lower or "allowinsecure=true" in line_lower:
                  continue

              try:
                  parsed = urlparse(line)
                  user_info = parsed.netloc.rsplit('@', 1)[0] if '@' in parsed.netloc else ''
                  netloc = parsed.netloc.split('@')[-1]
                  
                  if ':' in netloc:
                      host, port = netloc.split(':', 1)
                  else:
                      host, port = netloc, '443'
                  
                  host = host.lower().strip()
                  port = port.strip()

                  query_params = parse_qs(parsed.query)
                  sni = query_params.get('sni', [''])[0].lower().strip()

                  proto = parsed.scheme.lower()
                  unique_key = f"{proto}:{user_info}:{host}:{port}:{sni}"

                  if unique_key not in vt_seen_keys:
                      vt_seen_keys.add(unique_key)
                      base_config = line.split('#')[0].strip()
                      vt_cleaned_configs.append(base_config)

              except Exception:
                  continue

          print(f"✨ تعداد کل کانفیگ‌های یکتای VLESS/Trojan: {len(vt_cleaned_configs)}")

          # ==================== شماره‌گذاری و ذخیره‌سازی ====================
          counter_file = "counter.txt"
          start_counter = 1
          if os.path.exists(counter_file):
              try:
                  with open(counter_file, "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content.isdigit():
                          start_counter = int(content) + 1
              except Exception:
                  pass

          current_num = start_counter

          # ۱. خروجی هیستریا
          final_output = []
          tag_prefix = quote("♾️ULTRA-TITAN-SRV-")
          for cfg in cleaned_configs:
              final_output.append(f"{cfg}#{tag_prefix}{current_num}")
              current_num += 1

          with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_output) + ("\n" if final_output else ""))

          # ۲. خروجی VLESS و Trojan
          vt_final_output = []
          vt_tag_prefix = quote("♾️ULTRA-TITAN-VT-")
          for cfg in vt_cleaned_configs:
              vt_final_output.append(f"{cfg}#{vt_tag_prefix}{current_num}")
              current_num += 1

          with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(vt_final_output) + ("\n" if vt_final_output else ""))

          # ذخیره آخرین شماره شمارنده
          last_saved_num = current_num - 1 if (final_output or vt_final_output) else (start_counter - 1 if start_counter > 1 else 0)
          with open(counter_file, "w", encoding="utf-8") as f:
              f.write(str(last_saved_num))

          print(f"\n🎉 فایل hy2_filtered.txt با موفقیت ساخته شد ({len(final_output)} کانفیگ).")
          print(f"🎉 فایل vless_trojan_filtered.txt با موفقیت ساخته شد ({len(vt_final_output)} کانفیگ).")
          print(f"🔢 شماره‌گذاری از {start_counter} تا {last_saved_num} ذخیره شد.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hy2 and VLESS/Trojan configs [skip ci]" && git push)
