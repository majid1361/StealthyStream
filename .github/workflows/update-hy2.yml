name: StealthyStream Multi-Source Aggregator

on:
  schedule:
    - cron: '0 0 * * *' # هر روز، ساعت ۰۰:۰۰ UTC
  workflow_dispatch: # اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # دریافت مخزن و آماده‌سازی پایتون
      # ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ─────────────────────────────────────────────
      # نصب وابستگی‌ها
      # ─────────────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ─────────────────────────────────────────────
      # دریافت، پالایش، یکتاسازی و ذخیرهٔ کانفیگ‌ها
      # ─────────────────────────────────────────────
      - name: Fetch, Deduplicate and Normalize Configs
        run: |
          python - << 'EOF'
          import os
          import re
          import html
          import base64
          import requests
          from urllib.parse import urlparse, parse_qs, quote

          # ─────────────────────────────────────────
          # سورس‌های عمومی هیستریا (Hysteria 1 & 2)
          # ─────────────────────────────────────────
          HY2_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_extracted_configs.txt",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt",
              "https://ogy.de/oneclickvpnkeys-free-sub",
              "https://raw.githubusercontent.com/arshiacomplus/v2rayExtractor/refs/heads/main/mix/sub.html",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs_tested.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          # ─────────────────────────────────────────
          # سورس‌های عمومی VLESS پروتکل‌های مجاز
          # ─────────────────────────────────────────
          VLESS_TROJAN_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/splitted/vless",
              "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",
              "https://raw.githubusercontent.com/kasesm/Free-Config/refs/heads/main/all_raw.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt"
          ]

          # ─────────────────────────────────────────
          # کانال‌های عمومی تلگرام
          # ─────────────────────────────────────────
          TELEGRAM_CHANNELS = [
              "prrofile_purple",
              "mehrosaboran",
              "persianvpnhub",
              "daily_configs",
              "allproconf",
              "vpnplusee_free",
              "oneclickvpnkeys",
              "ConfigV2rayNG",
              "V2rayuir",
              "v2ray_dalghak1",
              "proxy_kafee",
              "FreakConfig",
              "VmessProtocol",
              "v2rayNG_Matsuri",
              "VpnProxy4free",
              "PrivateVPNs",
              "free1_vpn",
              "makvaslim"
          ]

          # ─────────────────────────────────────────
          # تنظیمات عمومی درخواست‌ها
          # ─────────────────────────────────────────
          TIMEOUT = 15
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/122.0.0.0 Safari/537.36"
              )
          }

          # ─────────────────────────────────────────
          # پروتکل‌های مجاز و تفکیک فایل‌های خروجی
          # ─────────────────────────────────────────
          HY2_PROTOCOLS = (
              "hysteria2://",
              "hysteria://",
              "hy2://"
          )

          VLESS_TROJAN_PROTOCOLS = (
              "vless://",
              "vmess://",
              "trojan://",
              "tuic://",
              "warp://"
          )

          # ─────────────────────────────────────────
          # الگوهای ناامن یا ناسازگار برای حذف
          # ─────────────────────────────────────────
          UNSAFE_PATTERNS = (
              "insecure=1",
              "insecure=true",
              "allowinsecure=1",
              "allowinsecure=true",
              "skip-cert-verify=1",
              "skip-cert-verify=true",
              "tlsinsecure=1",
              "tlsinsecure=true",
              "mitm",
              "@127.0.0.1:",
              "@localhost:",
              "@0.0.0.0:"
          )

          # ─────────────────────────────────────────
          # الگوی استخراج پروتکل‌های مجاز از تلگرام
          # ─────────────────────────────────────────
          CONFIG_REGEX = re.compile(
              r'(?:vless|vmess|trojan|tuic|warp|hysteria2|hysteria|hy2)://[^\s<>"\'`]+',
              re.IGNORECASE
          )

          # ─────────────────────────────────────────
          # محل نگهداری موقت کانفیگ‌های خام
          # ─────────────────────────────────────────
          raw_hy2_items = []
          raw_vless_trojan_items = []

          print("📥 دریافت کانفیگ‌ها آغاز شد.")

          # ─────────────────────────────────────────
          # خواندن و تفکیک کانفیگ‌های custom.txt
          # ─────────────────────────────────────────
          if os.path.exists("custom.txt"):
              try:
                  with open("custom.txt", "r", encoding="utf-8") as file:
                      lines = file.read().replace("\r", "").split("\n")

                  for line in lines:
                      line_clean = line.strip()

                      if line_clean.startswith(HY2_PROTOCOLS):
                          raw_hy2_items.append(line_clean)
                      elif line_clean.startswith(VLESS_TROJAN_PROTOCOLS):
                          raw_vless_trojan_items.append(line_clean)

                  print("✅ فایل custom.txt خوانده و تفکیک شد.")
              except Exception as error:
                  print(f"❌ خطا در خواندن custom.txt: {error}")

          # ─────────────────────────────────────────
          # دیکود Base64 در صورت نیاز
          # ─────────────────────────────────────────
          def decode_if_base64(text):
              text_stripped = text.strip()

              try:
                  decoded = base64.b64decode(
                      text_stripped,
                      validate=True
                  ).decode("utf-8", errors="ignore")

                  supported_protocols = (
                      "vless://",
                      "vmess://",
                      "trojan://",
                      "tuic://",
                      "warp://",
                      "hysteria2://",
                      "hysteria://",
                      "hy2://"
                  )

                  if any(protocol in decoded for protocol in supported_protocols):
                      return decoded
              except Exception:
                  pass

              return text

          # ─────────────────────────────────────────
          # دریافت و پردازش فایل‌های وب/گیت‌هاب
          # ─────────────────────────────────────────
          def fetch_urls(urls, target_protocols, target_list, label):
              for raw_url in urls:
                  url = raw_url.split("#")[0].strip()

                  try:
                      response = requests.get(
                          url,
                          headers=HEADERS,
                          timeout=TIMEOUT
                      )

                      if response.status_code != 200:
                          print(
                              f"⚠️ دریافت ناموفق ({response.status_code}): {url}"
                          )
                          continue

                      content = decode_if_base64(response.text)
                      lines = content.replace("\r", "").split("\n")[:200]
                      count = 0

                      for line in lines:
                          line_clean = line.strip()

                          if line_clean.startswith(target_protocols):
                              target_list.append(line_clean)
                              count += 1

                      print(
                          f"✅ منبع {label}: {url} "
                          f"[تعداد استخراج‌شده: {count}]"
                      )

                  except Exception as error:
                      print(f"❌ خطا در دریافت {label} از {url}: {error}")

          # ─────────────────────────────────────────
          # استخراج کانفیگ‌ها از صفحات عمومی تلگرام
          # ─────────────────────────────────────────
          def fetch_telegram_channels(channels):
              print("\n📡 استخراج کانفیگ‌ها از کانال‌های تلگرام آغاز شد.")

              for channel in channels:
                  channel_name = (
                      channel.strip()
                      .replace("https://t.me/", "")
                      .replace("@", "")
                      .split("/")[0]
                  )

                  if not channel_name:
                      continue

                  url = f"https://t.me/s/{channel_name}"

                  try:
                      response = requests.get(
                          url,
                          headers=HEADERS,
                          timeout=TIMEOUT
                      )

                      if response.status_code != 200:
                          print(
                              f"⚠️ کانال @{channel_name}: "
                              f"وضعیت HTTP {response.status_code}"
                          )
                          continue

                      # 🟢 باز کردن تگ‌های بلاک و تاشو
                      page_text = re.sub(r'<(div|br|p|blockquote)[^>]*>', '\n', response.text, flags=re.IGNORECASE)
                      page_text = re.sub(r'<[^>]+>', '', page_text)
                      page_text = html.unescape(page_text)
                      
                      # کل کانفیگ‌های صفحه شکار شن
                      found_configs = CONFIG_REGEX.findall(page_text)

                      hy2_count = 0
                      vless_trojan_count = 0

                      for config in found_configs:
                          config_clean = config.strip().rstrip(".,;()[]{}")
                          config_lower = config_clean.lower()

                          if config_lower.startswith(HY2_PROTOCOLS):
                              raw_hy2_items.append(config_clean)
                              hy2_count += 1
                          elif config_lower.startswith(VLESS_TROJAN_PROTOCOLS):
                              raw_vless_trojan_items.append(config_clean)
                              vless_trojan_count += 1

                      print(
                          f"✅ تلگرام @{channel_name}: "
                          f"Hy2: {hy2_count} | "
                          f"سایر پروتکل‌های مجاز: {vless_trojan_count}"
                      )

                  except Exception as error:
                      print(f"❌ خطا در کانال @{channel_name}: {error}")

          # ─────────────────────────────────────────
          # اجرای دریافت از تلگرام
          # سورس‌های وب حفظ شده‌اند
          # ─────────────────────────────────────────
          # fetch_urls(HY2_PUBLIC_URLS, HY2_PROTOCOLS, raw_hy2_items, "Hy2")
          # fetch_urls(
          #     VLESS_TROJAN_PUBLIC_URLS,
          #     VLESS_TROJAN_PROTOCOLS,
          #     raw_vless_trojan_items,
          #     "VLESS/Other"
          # )

          fetch_telegram_channels(TELEGRAM_CHANNELS)

          # ─────────────────────────────────────────
          # پالایش امنیتی و حذف کانفیگ‌های تکراری
          # ─────────────────────────────────────────
          seen_keys = set()

          def process_and_dedup(raw_list):
              cleaned = []

              for line in raw_list:
                  line_lower = line.lower()

                  if any(pattern in line_lower for pattern in UNSAFE_PATTERNS):
                      continue

                  try:
                      parsed = urlparse(line)
                      protocol = parsed.scheme.lower()

                      # پروتکل‌هایی که یکتاسازی‌شان بر اساس کل متن انجام می‌شود
                      if protocol in {
                          "vmess",
                          "warp",
                          "tuic"
                      }:
                          base_config = line.split("#")[0].strip()
                          unique_key = f"{protocol}:{base_config}"

                          if unique_key not in seen_keys:
                              seen_keys.add(unique_key)
                              cleaned.append(base_config)

                          continue

                      # کلید یکتا بر اساس پروتکل، اطلاعات کاربر، میزبان،
                      # پورت و SNI ساخته می‌شود.
                      user_info = (
                          parsed.netloc.rsplit("@", 1)[0]
                          if "@" in parsed.netloc
                          else ""
                      )
                      netloc = parsed.netloc.split("@")[-1]

                      if ":" in netloc:
                          host, port = netloc.split(":", 1)
                      else:
                          host, port = netloc, "443"

                      host = host.lower().strip()
                      port = port.strip()

                      query_params = parse_qs(parsed.query)
                      sni = query_params.get("sni", [""])[0].lower().strip()

                      unique_key = (
                          f"{protocol}:{user_info}:{host}:{port}:{sni}"
                      )

                      if unique_key not in seen_keys:
                          seen_keys.add(unique_key)
                          base_config = line.split("#")[0].strip()
                          cleaned.append(base_config)

                  except Exception:
                      continue

              return cleaned

          print("\n🔍 پالایش و یکتاسازی کانفیگ‌ها آغاز شد.")

          cleaned_hy2 = process_and_dedup(raw_hy2_items)
          cleaned_vless_trojan = process_and_dedup(raw_vless_trojan_items)

          print(f"✨ تعداد کانفیگ‌های یکتای هیستریا: {len(cleaned_hy2)}")
          print(
              "✨ تعداد کانفیگ‌های یکتای سایر پروتکل‌های مجاز: "
              f"{len(cleaned_vless_trojan)}"
          )
          
          # ─────────────────────────────────────────
          # پالایش دامنه‌های نامعتبر و منقضی (DNS Filter)
          # ─────────────────────────────────────────
          import socket
          import ipaddress
          from concurrent.futures import ThreadPoolExecutor

          def is_valid_and_alive(config_line: str) -> bool:
              try:
                  raw = config_line.strip()
                  if not raw or "://" not in raw:
                      return False

                  match = re.search(r"://(?:[^@]+@)?(\[[a-fA-F0-9:]+\]|[^:/?#]+)(?::(\d+))?", raw)
                  if not match:
                      return False

                  host = match.group(1).strip("[]")
                  if not host:
                      return False

                  try:
                      ip_obj = ipaddress.ip_address(host)
                      if (
                          ip_obj.is_loopback
                          or ip_obj.is_unspecified
                          or ip_obj.is_reserved
                          or ip_obj.is_link_local
                      ):
                          return False
                      return True
                  except ValueError:
                      pass

                  try:
                      socket.setdefaulttimeout(3)
                      target_ip = socket.gethostbyname(host)
                      ip_obj = ipaddress.ip_address(target_ip)
                      if (
                          ip_obj.is_loopback
                          or ip_obj.is_unspecified
                          or ip_obj.is_reserved
                          or ip_obj.is_link_local
                      ):
                          return False
                      return True
                  except (socket.gaierror, socket.herror):
                      return False

              except Exception:
                  return True

          def safe_clean_configs(config_list, max_workers=50):
              if not config_list:
                  return []
              with ThreadPoolExecutor(max_workers=max_workers) as executor:
                  results = list(executor.map(is_valid_and_alive, config_list))
              return [cfg for cfg, valid in zip(config_list, results) if valid]

          print("\n🌐 پالایش DNS و دامنه‌های غیرفعال...")
          cleaned_hy2 = safe_clean_configs(cleaned_hy2)
          cleaned_vless_trojan = safe_clean_configs(cleaned_vless_trojan)
          print(f"✅ پس از فیلتر DNS -> هیستریا: {len(cleaned_hy2)} | سایر پروتکل‌ها: {len(cleaned_vless_trojan)}")

          # ─────────────────────────────────────────
          # ادامهٔ شماره‌گذاری سراسری از counter.txt
          # ─────────────────────────────────────────
          counter_file = "counter.txt"
          start_counter = 1

          if os.path.exists(counter_file):
              try:
                  with open(counter_file, "r", encoding="utf-8") as file:
                      counter_content = file.read().strip()

                  if counter_content.isdigit():
                      start_counter = int(counter_content) + 1
              except Exception:
                  pass

          current_number = start_counter
          tag_prefix = quote("♾️ULTRA-TITAN-SRV-")

                    # ─────────────────────────────────────────
          # شماره‌گذاری خروجی پروتکل‌های پایه
          # ─────────────────────────────────────────
          final_vless_trojan = []

          for config in cleaned_vless_trojan:
              final_vless_trojan.append(
                  f"{config}#{tag_prefix}{current_number}"
              )
              current_number += 1

          # ─────────────────────────────────────────
          # شماره‌گذاری خروجی پروتکل‌ هیستریا
          # ─────────────────────────────────────────
          final_hy2 = []

          for config in cleaned_hy2:
              final_hy2.append(
                  f"{config}#{tag_prefix}{current_number}"
              )
              current_number += 1

                    # ─────────────────────────────────────────
          # ذخیرهٔ خروجی‌ها در فایل‌های جداگانه
          # ─────────────────────────────────────────
          with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as file:
              file.write("\n".join(final_vless_trojan))
              if final_vless_trojan:
                  file.write("\n")

          with open("hy2_filtered.txt", "w", encoding="utf-8") as file:
              file.write("\n".join(final_hy2))
              if final_hy2:
                  file.write("\n")

          # ─────────────────────────────────────────
          # ذخیرهٔ آخرین شمارهٔ استفاده‌شده
          # ─────────────────────────────────────────
          total_configs = len(final_hy2) + len(final_vless_trojan)

          if total_configs > 0:
              last_saved_number = current_number - 1
          elif start_counter > 1:
              last_saved_number = start_counter - 1
          else:
              last_saved_number = 0

          with open(counter_file, "w", encoding="utf-8") as file:
              file.write(str(last_saved_number))

          print(
              f"\n🎉 hy2_filtered.txt آماده شد "
              f"({len(final_hy2)} کانفیگ)."
          )
          print(
              f"🎉 vless_trojan_filtered.txt آماده شد "
              f"({len(final_vless_trojan)} کانفیگ)."
          )
          print(
              f"🔢 شماره‌گذاری از {start_counter} "
              f"تا {last_saved_number} ثبت شد."
          )
          EOF

      # ─────────────────────────────────────────────
      # ثبت و ارسال فایل‌های خروجی به مخزن
      # ─────────────────────────────────────────────
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt
          git commit -m "Update filtered configs and counter [CI]" || exit 0
          git push
