name: StealthyStream Multi-Source Aggregator

permissions:
  contents: write

concurrency:
  group: stealthystream-aggregator
  cancel-in-progress: false

on:
  schedule:
    # اجرا هر ۶ ساعت یک‌بار (ساعت 00:00, 06:00, 12:00, 18:00 به وقت UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی با دکمه Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests dnspython

      - name: Fetch, Deduplicate and Normalize Configs
        run: |
          python - << 'EOF'
          import os
          import re
          import html
          import time
          import base64
          import ipaddress
          import dns.exception
          import dns.resolver
          import requests
          from urllib.parse import urlparse, parse_qs, quote, unquote

          # ============================================================
          # ۱. سورس‌ها (دست‌نخورده — همان لیست‌های خودت)
          # ============================================================
          HY2_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_extracted_configs.txt",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt",
              "https://ogy.de/oneclickvpnkeys-free-sub",
              "https://raw.githubusercontent.com/arshiacomplus/v2rayExtractor/refs/heads/main/mix/sub.html",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs_tested.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          VLESS_TROJAN_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",
              "https://raw.githubusercontent.com/kasesm/Free-Config/refs/heads/main/all_raw.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt"
          ]

          TELEGRAM_CHANNELS = [
              "allproconf", "SSRSUB", "proxy_kafee", "persianvpnhub",
              "v2ray_dalghak1", "prrofile_purple", "Hope_Net", "FreakConfig",
              "VpnProxy4free", "V2ray_worlds", "oneclickvpnkeys", "free1_vpn",
              "Outline_ir", "Shh_Proxy", "Filtershekan_channel",
              "v2rayNG_Matsuri", "VmessProtocol"
          ]

          TIMEOUT = 15
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          HY2_PROTOCOLS = ("hysteria2://", "hysteria://", "hy2://")
          VLESS_TROJAN_PROTOCOLS = ("vless://", "trojan://")
          ALL_PROTOCOLS = HY2_PROTOCOLS + VLESS_TROJAN_PROTOCOLS

          # ============================================================
          # ۲. فیلترهای ناامن — دقیق و Query-based (به‌جای substring کور)
          # ============================================================
          UNSAFE_QUERY_KEYS = {
              "insecure", "allowinsecure", "skip-cert-verify",
              "skipcertverify", "tlsinsecure"
          }
          UNSAFE_TRUE_VALUES = {"1", "true", "yes", "on"}
          UNSAFE_TEXT_PATTERNS = ("mitm",)

          # ریجکس استخراج کانفیگ از متن و کپشن تلگرام
          CONFIG_REGEX = re.compile(
              r'(?:vless|trojan|hysteria2|hysteria|hy2)://[^\s<>"\'`]+',
              re.IGNORECASE
          )

          # ============================================================
          # ۳. ابزارهای عمومی
          # ============================================================
          raw_hy2_items = []
          raw_vless_trojan_items = []

          def remove_bom(text):
              return text.lstrip("\ufeff")

          def repeatedly_unquote(value, rounds=3):
              """برای کشف الگوهای URL-encoded تودرتو (fragment/finalMask)."""
              result = html.unescape(str(value))
              for _ in range(rounds):
                  decoded = unquote(result)
                  if decoded == result:
                      break
                  result = decoded
              return result

          def strip_display_name(config):
              """فقط نام نمایشی بعد از # را حذف می‌کند (نه بخش‌های دیگر URI)."""
              return config.split("#", 1)[0].strip()

          def is_ip_address(host):
              try:
                  ipaddress.ip_address(host)
                  return True
              except ValueError:
                  return False

          def starts_with_protocol(value, protocols=ALL_PROTOCOLS):
              # 🆕 فیکس باگ ۳: case-insensitive
              return value.strip().lower().startswith(protocols)

          def normalize_candidate(candidate):
              """پاک‌سازی محافظه‌کارانه؛ بدون تغییر در بدنهٔ URI."""
              if not isinstance(candidate, str):
                  return ""
              candidate = html.unescape(candidate)
              candidate = remove_bom(candidate).strip()
              # نویسه‌های چسبیده در HTML/کپشن
              candidate = candidate.rstrip(".,;")
              return candidate

          def extract_host(config):
              try:
                  # 🆕 فیکس باگ ۱: IPv6-safe با hostname خود urlparse
                  host = urlparse(config).hostname
                  if not host:
                      return None
                  return host.strip().strip("[]").lower()
              except Exception:
                  return None

          # ============================================================
          # ۴. Base64 مقاوم — فیکس باگ ۲ (padding + URL-safe)
          # ============================================================
          BASE64_CHARSET = re.compile(r"^[A-Za-z0-9+/=_\-\r\n\t ]+$")

          def decode_if_base64(text):
              original = remove_bom(text).strip()
              if not original:
                  return original

              # اگر URI مستقیم در متن هست، دست نمی‌زنیم
              if any(p in original.lower() for p in ALL_PROTOCOLS):
                  return original

              compact = re.sub(r"\s+", "", original)
              if len(compact) < 16 or not BASE64_CHARSET.fullmatch(compact):
                  return original

              padded = compact + ("=" * (-len(compact) % 4))  # 🆕 padding خودکار

              for decoder in (base64.b64decode, base64.urlsafe_b64decode):  # 🆕 URL-safe
                  try:
                      decoded = decoder(padded).decode("utf-8", errors="strict")
                      if any(p in decoded.lower() for p in ALL_PROTOCOLS):
                          return decoded
                  except Exception:
                      continue
              return original

          # ============================================================
          # ۵. فیلتر JSON/Fragment — هدفمند (finalMask / fragment+packets)
          # ============================================================
          def is_json_fragment_config(config):
              decoded = repeatedly_unquote(config, rounds=4)
              normalized = re.sub(r"\s+", "", decoded).lower()

              if "finalmask" in normalized:
                  return True

              has_fragment = (
                  '"fragment"' in normalized
                  or "'fragment'" in normalized
                  or "fragment=" in normalized
              )
              has_packets = (
                  '"packets"' in normalized
                  or "'packets'" in normalized
                  or "packets=" in normalized
              )
              if has_fragment and has_packets:
                  return True

              # ساختارهای JSON رایج کلاینت‌ها
              json_patterns = (
                  '"type":"fragment"',
                  "'type':'fragment'",
                  '"fragment":{"packets"',
                  '"protocol":"freedom","settings":{"fragment"',
              )
              return any(p in normalized for p in json_patterns)

          # ============================================================
          # ۶. فیلتر امنیتی دقیق (به‌جای substring کور)
          # ============================================================
          def contains_unsafe_options(config):
              lowered = config.lower()
              if any(p in lowered for p in UNSAFE_TEXT_PATTERNS):
                  return True
              try:
                  parsed = urlparse(config)
                  query = parse_qs(parsed.query, keep_blank_values=True)
                  for key, values in query.items():
                      if key.strip().lower() in UNSAFE_QUERY_KEYS:
                          for value in values:
                              if value.strip().lower() in UNSAFE_TRUE_VALUES:
                                  return True
              except Exception:
                  return False  # خطای parse دلیل حذف نیست
              return False

          # ============================================================
          # ۷. استخراج کانفیگ از متن (خطوط مستقیم + HTML)
          # ============================================================
          def extract_configs_from_text(text):
              if not isinstance(text, str):
                  return []
              text = remove_bom(text)
              text = re.sub(r"<br\s*/?>", "\n", text, flags=re.I)
              text = html.unescape(text)

              results = []
              # خطوط مستقیم
              for raw_line in text.replace("\r", "").split("\n"):
                  line = normalize_candidate(raw_line)
                  if starts_with_protocol(line):
                      results.append(line)
              # لینک‌های لابلای HTML/کپشن
              for match in CONFIG_REGEX.findall(text):
                  candidate = normalize_candidate(match)
                  if starts_with_protocol(candidate):
                      results.append(candidate)
              return results

          def append_config(config, source_list):
              config = normalize_candidate(config)
              if not config:
                  return False
              lowered = config.lower()
              if lowered.startswith(HY2_PROTOCOLS):
                  raw_hy2_items.append(config)
                  return True
              if lowered.startswith(VLESS_TROJAN_PROTOCOLS):
                  raw_vless_trojan_items.append(config)
                  return True
              return False

          # ============================================================
          # ۸. دریافت‌کننده‌ها
          # ============================================================
          def load_custom_file():
              if not os.path.exists("custom.txt"):
                  print("ℹ️ فایل custom.txt وجود ندارد.")
                  return
              try:
                  with open("custom.txt", "r", encoding="utf-8-sig") as f:
                      configs = extract_configs_from_text(f.read())
                  added = sum(1 for c in configs if append_config(c, None))
                  print(f"✅ موفق: custom.txt خوانده و تفکیک شد [{added} کانفیگ].")
              except Exception as e:
                  print(f"❌ خطا در خواندن custom.txt -> {e}")

          def fetch_telegram_channels(channels):
              print("\n📡 در حال اسکرپ کانال‌های تلگرامی...")
              for ch in channels:
                  ch_name = ch.strip().replace("https://t.me/", "").replace("@", "").split("/")[0]
                  if not ch_name:
                      continue
                  url = f"https://t.me/s/{ch_name}"
                  try:
                      res = requests.get(url, headers=HEADERS, timeout=TIMEOUT)
                      if res.status_code == 200:
                          found = extract_configs_from_text(res.text)
                          hy2_count = vless_count = 0
                          for cfg in found:
                              lowered = cfg.lower()
                              if lowered.startswith(HY2_PROTOCOLS):
                                  raw_hy2_items.append(cfg)
                                  hy2_count += 1
                              elif lowered.startswith(VLESS_TROJAN_PROTOCOLS):
                                  raw_vless_trojan_items.append(cfg)
                                  vless_count += 1
                          print(f"✅ تلگرام (@{ch_name}): [Hy2: {hy2_count} | Vless/Trojan: {vless_count}]")
                      else:
                          print(f"⚠️ تلگرام (@{ch_name}): کد وضعیت ناموفق ({res.status_code})")
                  except Exception as e:
                      print(f"❌ خطا در کانال تلگرام (@{ch_name}) -> {e}")

          def fetch_urls(urls, accepted_protocols, label):
              for raw_url in urls:
                  url = raw_url.split('#')[0].strip()
                  try:
                      res = requests.get(url, headers=HEADERS, timeout=TIMEOUT)
                      if res.status_code == 200:
                          content = decode_if_base64(res.text)
                          configs = [
                              c for c in extract_configs_from_text(content)
                              if c.lower().startswith(accepted_protocols)
                          ]
                          added = sum(1 for c in configs if append_config(c, None))
                          print(f"✅ موفق ({label}): {url} [استخراج شد: {added}]")
                      else:
                          print(f"⚠️ کد وضعیت ناموفق ({res.status_code}): {url}")
                  except Exception as e:
                      print(f"❌ خطا در دانلود ({label}): {url} -> {e}")

          # ============================================================
          # ۹. Dedup دقیق — فیکس باگ ۴ (کلید کامل با پارامترهای Transport)
          # ============================================================
          IMPORTANT_QUERY_KEYS = {
              "type", "security", "path", "servicename", "service_name",
              "host", "sni", "pbk", "sid", "fp", "encryption",
              "headertype", "alpn", "flow", "mode", "authority",
              "obfs", "obfs-password"
          }
          CASE_INSENSITIVE_KEYS = {
              "type", "security", "sni", "host", "fp", "alpn",
              "encryption", "headertype", "flow", "mode"
          }

          def canonical_query(query):
              parsed_query = parse_qs(query, keep_blank_values=True)
              items = []
              for raw_key, values in parsed_query.items():
                  key = raw_key.strip().lower()
                  if key not in IMPORTANT_QUERY_KEYS:
                      continue
                  norm_values = []
                  for value in values:
                      value = unquote(value).strip()
                      if key in CASE_INSENSITIVE_KEYS:
                          value = value.lower()
                      norm_values.append(value)
                  norm_values.sort()
                  items.append((key, tuple(norm_values)))
              items.sort(key=lambda item: item[0])
              return tuple(items)

          def build_dedup_key(config):
              """None یعنی قابل parse نیست → با کلید متنی نگه داشته می‌شود (حذف نمی‌شود)."""
              try:
                  base = strip_display_name(config)
                  parsed = urlparse(base)
                  scheme = parsed.scheme.lower()

                  host = parsed.hostname
                  if not host:
                      return None
                  host = host.strip().strip("[]").lower()

                  try:
                      port = parsed.port
                  except ValueError:
                      return None
                  if port is None:
                      port = 443
                  if not (1 <= port <= 65535):
                      return None

                  # user-info خام می‌ماند (UUID/پسورد case-sensitive است)
                  user_info = parsed.netloc.rsplit("@", 1)[0] if "@" in parsed.netloc else ""

                  return (scheme, user_info, host, port, canonical_query(parsed.query))
              except Exception:
                  return None

          def process_and_dedup(raw_fallback = set()

 cleaned = []
              seen_structured = set()
              seen_fallback = set()

              unsafe_removed = fragment_removed = dup_removed = invalid_removed = fallback_kept = 0

              for line in raw_list:
                  config = normalize_candidate(line)
                  if not config or not starts_with_protocol(config):
                      invalid_removed += 1
                      continue

                  # 🆕 فیلتر JSON/Fragment (مثل کانفیگ‌های اسکرین‌شاتت)
                  if is_json_fragment_config(config):
                      fragment_removed += 1
                      continue

                  # فیلتر امنیتی دقیق
                  if contains_unsafe_options(config):
                      unsafe_removed += 1
                      continue

                  base = strip_display_name(config)
                  if not base:
                      invalid_removed += 1
                      continue

                  key = build_dedup_key(base)
                  if key is None:
                      # 🆕 فیکس باگ ۸: خطای parse → حذف نمی‌شود، Dedup متنی
                      if base in seen_fallback:
                          dup_removed += 1
                      else:
                          seen_fallback.add(base)
                          cleaned.append(base)
                          fallback_kept += 1
                      continue

                  if key in seen_structured:
                      dup_removed += 1
                      continue

                  seen_structured.add(key)
                  cleaned.append(base)

              print(f"\n🧹 نتیجه پردازش {label}:")
              print(f"   ورودی: {len(raw_list)}")
              print(f"   یکتا و نگهداری‌شده: {len(cleaned)}")
              print(f"   تکراری حذف‌شده: {dup_removed}")
              print(f"   Unsafe حذف‌شده: {unsafe_removed}")
              print(f"   JSON/Fragment حذف‌شده: {fragment_removed}")
              print(f"   نامعتبر حذف‌شده: {invalid_removed}")
              print(f"   Parse نامشخص ولی نگهداری‌شده: {fallback_kept}")
              return cleaned

          # ============================================================
          # ۱۰. Health Check محافظه‌کارانه — فقط NXDOMAIN قطعی
          #     ❌ بدون TCP Ping (Hysteria روی UDP/QUIC است!)
          #     ❌ بدون UDP Ping (UDP اتصال ندارد و جواب قطعی نمی‌دهد)
          #     ✅ فقط وقتی هر ۳ Resolver مستقل صریحاً NXDOMAIN بدهند حذف می‌شود
          # ============================================================
          DNS_RESOLVERS = ("1.1.1.1", "8.8.8.8", "9.9.9.9")
          DNS_CACHE = {}

          def query_resolver(host, nameserver):
              """EXISTS / NXDOMAIN / UNKNOWN"""
              resolver = dns.resolver.Resolver(configure=False)
              resolver.nameservers = [nameserver]
              resolver.timeout = 2.5
              resolver.lifetime = 4.0
              try:
                  resolver.resolve(host, "A", raise_on_no_answer=False)
                  return "EXISTS"
              except dns.resolver.NXDOMAIN:
                  # شاید فقط IPv6 داشته باشد
                  try:
                      resolver.resolve(host, "AAAA", raise_on_no_answer=False)
                      return "EXISTS"
                  except dns.resolver.NXDOMAIN:
                      return "NXDOMAIN"
                  except (dns.resolver.NoAnswer, dns.exception.DNSException):
                      # NoAnswer یعنی دامنه وجود دارد
                      return "EXISTS" if isinstance(sys_last_exception(), dns.resolver.NoAnswer) else "UNKNOWN"
              except dns.resolver.NoAnswer:
                  return "EXISTS"
              except dns.exception.DNSException:
                  return "UNKNOWN"
              except Exception:
                  return "UNKNOWN"

          def sys_last_exception():
              return None  # placeholder ساده — در مسیر AAAA به NoAnswer نمی‌رسیم چون NXDOMAIN جدا هندل شده

          def get_domain_health(host):
              """ALIVE / DEAD / UNKNOWN — فقط ۳ NXDOMAIN مستقل = DEAD"""
              host = host.strip().strip("[]").lower()
              if not host:
                  return "UNKNOWN"
              if is_ip_address(host):
                  return "ALIVE"  # 🆕 IPها اصلاً DNS چک نمی‌شوند
              if host in DNS_CACHE:
                  return DNS_CACHE[host]

              results = []
              for ns in DNS_RESOLVERS:
                  result = query_resolver(host, ns)
                  results.append(result)
                  if result == "EXISTS":
                      DNS_CACHE[host] = "ALIVE"
                      return "ALIVE"

              if all(r == "NXDOMAIN" for r in results):
                  DNS_CACHE[host] = "DEAD"
                  return "DEAD"

              DNS_CACHE[host] = "UNKNOWN"
              return "UNKNOWN"

          def filter_definitely_dead_domains(configs, label):
              kept = []
              alive = ip_kept = unknown = dead_removed = 0

              for index, config in enumerate(configs, start=1):
                  host = extract_host(config)
                  if not host:
                      kept.append(config)
                      unknown += 1
                      continue

                  if is_ip_address(host):
                      kept.append(config)
                      ip_kept += 1
                      continue

                  status = get_domain_health(host)
                  if status == "DEAD":
                      dead_removed += 1
                      print(f"   🗑️ NXDOMAIN قطعی: {host}")
                  else:
                      kept.append(config)
                      if status == "ALIVE":
                          alive += 1
                      else:
                          unknown += 1

                  if index % 100 == 0:
                      print(f"   DNS progress ({label}): {index}/{len(configs)}")

              print(f"\n🌐 نتیجه DNS ({label}):")
              print(f"   دامنه زنده: {alive} | IP بدون چک: {ip_kept}")
              print(f"   نامشخص و نگهداری‌شده: {unknown}")
              print(f"   NXDOMAIN قطعی حذف‌شده: {dead_removed}")
              print(f"   خروجی: {len(kept)}")
              return kept

          # ============================================================
          # ۱۱. اجرای اصلی — ترتیب جدید: custom ← تلگرام ← گیت‌هاب (فیکس باگ ۵)
          # ============================================================
          print("📥 در حال دریافت کانفیگ‌ها از منابع...")

          load_custom_file()
          fetch_telegram_channels(TELEGRAM_CHANNELS)
          fetch_urls(HY2_PUBLIC_URLS, HY2_PROTOCOLS, "Hy2")
          fetch_urls(VLESS_TROJAN_PUBLIC_URLS, VLESS_TROJAN_PROTOCOLS, "Vless/Trojan")

          print("\n🔍 در حال فیلتر، اعتبارسنجی و حذف موارد تکراری...")
          cleaned_hy2 = process_and_dedup(raw_hy2_items, "Hysteria/Hysteria2")
          cleaned_vless_trojan = process_and_dedup(raw_vless_trojan_items, "Vless/Trojan")

          print(f"✨ تعداد هیستریا یکتا: {len(cleaned_hy2)}")
          print(f"✨ تعداد ویلس و تروجان یکتا: {len(cleaned_vless_trojan)}")

          print("\n🩺 بررسی محافظه‌کارانه DNS (بدون TCP/UDP Ping)...")
          cleaned_hy2 = filter_definitely_dead_domains(cleaned_hy2, "Hy2")
          cleaned_vless_trojan = filter_definitely_dead_domains(cleaned_vless_trojan, "Vless/Trojan")

          # ============================================================
          # ۱۲. کانتر و خروجی (منطق خودت — دست‌نخورده + گارد کانتر)
          # ============================================================
          counter_file = "counter.txt"
         (counter_file, "r", encoding=" os.path.exists(counter_file):
              try:
                  with open(counter_file, "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content.isdigit():
                          start_counter = int(content) + 1
              except Exception:
                  pass

          current_num = start_counter
          tag_prefix = quote("♾️ULTRA-TITAN-SRV-")

          final_hy2 = []
          for cfg in cleaned_hy2:
              final_hy2.append(f"{cfg}#{tag_prefix}{current_num}")
              current_num += 1

          final_vless_trojan = []
          for cfg in cleaned_vless_trojan:
              final_vless_trojan.append(f"{cfg}#{tag_prefix}{current_num}")
              current_num += 1

          with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_hy2) + ("\n" if final_hy2 else ""))

          with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_vless_trojan) + ("\n" if final_vless_trojan else ""))

          # 🆕 فیکس باگ ۱۱: در اجرای خالی، کانتر قبلی حفظ می‌شود
          total_configs = len(final_hy2) + len(final_vless_trojan)
          last_saved_num = current_num - 1 if total_configs > 0 else (start_counter - 1 if start_counter > 1 else 0)

          with open(counter_file, "w", encoding="utf-8") as f:
              f.write(str(last_saved_num))

          print(f"\n🎉 فایل hy2_filtered.txt آماده شد ({len(final_hy2)} کانفیگ).")
          print(f"🎉 فایل vless_trojan_filtered.txt آماده شد ({len(final_vless_trojan)} کانفیگ).")
          print(f"🔢 شماره‌گذاری از {start_counter} تا {last_saved_num} ثبت گردید.")
          EOF

      - name: Validate Generated Files
        run: |
          test -f hy2_filtered.txt
          test -f vless_trojan_filtered.txt
          test -f counter.txt
          grep -Eq '^[0-9]+$' counter.txt || { echo "❌ counter.txt نامعتبر است"; exit 1; }
          echo "✅ فایل‌های خروجی سالم هستند."
          echo "Hy2: $(wc -l < hy2_filtered.txt) خط | Vless/Trojan: $(wc -l < vless_trojan_filtered.txt) خط | Counter: $(cat counter.txt)"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hy2 & Vless/Trojan configs [skip ci]" && git push)
