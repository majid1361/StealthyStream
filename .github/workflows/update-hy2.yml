name: Update Hy2 and Vless Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests dnspython

      - name: Run Extraction Script
        run: |
          python - << 'EOF'
          import re
          import os
          import base64
          import ipaddress
          import requests
          from urllib.parse import unquote, quote
          import dns.resolver
          import dns.exception

          HY2_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_extracted_configs.txt",
              "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt",
              "https://ogy.de/oneclickvpnkeys-free-sub",
              "https://raw.githubusercontent.com/arshiacomplus/v2rayExtractor/refs/heads/main/mix/sub.html",
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs_tested.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          VLESS_TROJAN_PUBLIC_URLS = [
              "https://raw.githubusercontent.com/4n0nymou3/multi-proxy-config-fetcher/refs/heads/main/configs/proxy_configs.txt",
              "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt",
              "https://raw.githubusercontent.com/kasesm/Free-Config/refs/heads/main/all_raw.txt",
              "https://raw.githubusercontent.com/Danialsamadi/v2go/main/AllConfigsSub.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt"
          ]

          TELEGRAM_CHANNELS = [
              "allproconf", "SSRSUB", "proxy_kafee", "persianvpnhub",
              "v2ray_dalghak1", "prrofile_purple", "Hope_Net", "FreakConfig",
              "VpnProxy4free", "V2ray_worlds", "oneclickvpnkeys", "free1_vpn",
              "Outline_ir", "Shh_Proxy", "Filtershekan_channel",
              "v2rayNG_Matsuri", "VmessProtocol"
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          raw_hy2_items = []
          raw_vless_trojan_items = []

          # فیلتر کانفیگ‌های پیچیده جیسون و فرگمنت (finalMask / fragment)
          def is_bad_fragment(config):
              c_lower = unquote(config).lower()
              if "finalmask" in c_lower:
                  return True
              if "fragment" in c_lower and "packets" in c_lower:
                  return True
              return False

          # تست حذف سرورهای سوخته (فقط دامنه‌هایی که NXDOMAIN قطعی می‌دهند)
          DNS_RESOLVERS = ["1.1.1.1", "8.8.8.8"]
          DNS_CACHE = {}

          def is_definitely_dead(host):
              if not host:
                  return False
              host = host.strip().strip("[]").lower()
              try:
                  ipaddress.ip_address(host)
                  return False # IP ها دست نخورده باقی می‌مانند
              except ValueError:
                  pass

              if host in DNS_CACHE:
                  return DNS_CACHE[host]

              nx_count = 0
              for ns in DNS_RESOLVERS:
                  resolver = dns.resolver.Resolver(configure=False)
                  resolver.nameservers = [ns]
                  resolver.timeout = 2.0
                  resolver.lifetime = 2.0
                  try:
                      resolver.resolve(host, "A")
                      DNS_CACHE[host] = False
                      return False
                  except dns.resolver.NXDOMAIN:
                      try:
                          resolver.resolve(host, "AAAA")
                          DNS_CACHE[host] = False
                          return False
                      except dns.resolver.NXDOMAIN:
                          nx_count += 1
                      except Exception:
                          pass
                  except Exception:
                      pass

              if nx_count == len(DNS_RESOLVERS):
                  DNS_CACHE[host] = True
                  return True

              DNS_CACHE[host] = False
              return False

          def extract_host(config):
              try:
                  no_hash = config.split("#")[0]
                  after_at = no_hash.split("@")[-1]
                  host_port = after_at.split("?")[0].split("/")[0]
                  if ":" in host_port:
                      return host_port.rsplit(":", 1)[0]
                  return host_port
              except Exception:
                  return None

          def decode_base64_if_needed(text):
              try:
                  pad = len(text.strip()) % 4
                  if pad:
                      text += "=" * (4 - pad)
                  decoded = base64.b64decode(text).decode('utf-8', errors='ignore')
                  if any(p in decoded for p in ["vless://", "trojan://", "hysteria2://", "hy2://", "hysteria://"]):
                      return decoded
              except Exception:
                  pass
              return text

          def fetch_custom_configs():
              if os.path.exists("custom.txt"):
                  try:
                      with open("custom.txt", "r", encoding="utf-8") as f:
                          for line in f:
                              line = line.strip()
                              if not line:
                                  continue
                              if line.startswith(("hysteria2://", "hy2://", "hysteria://")):
                                  raw_hy2_items.append(line)
                              elif line.startswith(("vless://", "trojan://")):
                                  raw_vless_trojan_items.append(line)
                      print("✅ custom.txt با موفقیت بارگذاری شد.")
                  except Exception as e:
                      print(f"❌ خطا در خواندن custom.txt: {e}")

          def fetch_telegram_channels():
              print("\n📡 در حال اسکرپ کانال‌های تلگرامی...")
              for channel in TELEGRAM_CHANNELS:
                  url = f"https://t.me/s/{channel}"
                  try:
                      res = requests.get(url, headers=HEADERS, timeout=15)
                      if res.status_code == 200:
                          hy2_matches = re.findall(r'(?:hysteria2|hy2|hysteria)://[^\s<>"\'`]+', res.text, re.IGNORECASE)
                          vless_matches = re.findall(r'(?:vless|trojan)://[^\s<>"\'`]+', res.text, re.IGNORECASE)
                          
                          raw_hy2_items.extend(hy2_matches)
                          raw_vless_trojan_items.extend(vless_matches)
                          print(f"✅ کانال @{channel}: {len(hy2_matches)} Hy2 | {len(vless_matches)} Vless/Trojan")
                  except Exception as e:
                      print(f"❌ خطا در کانال @{channel}: {e}")

          def fetch_public_sources(urls, target_list, label, protocols):
              print(f"\n🌐 در حال دانلود سورس‌های عمومی {label}...")
              for url in urls:
                  try:
                      res = requests.get(url, headers=HEADERS, timeout=15)
                      if res.status_code == 200:
                          content = decode_base64_if_needed(res.text)
                          lines = content.splitlines()
                          count = 0
                          for line in lines:
                              line = line.strip()
                              if line.startswith(protocols):
                                  target_list.append(line)
                                  count += 1
                          print(f"✅ سورس {url}: استخراج {count} کانفیگ")
                  except Exception as e:
                      print(f"❌ خطا در سورس {url}: {e}")

          def process_and_dedup(configs, label):
              unique_configs = {}
              unsafe_count = 0
              fragment_count = 0
              dead_count = 0

              for cfg in configs:
                  cfg = cfg.strip()
                  if not cfg:
                      continue

                  # ۱. فیلتر فرگمنت و جیسون‌های خراب
                  if is_bad_fragment(cfg):
                      fragment_count += 1
                      continue

                  # ۲. فیلتر گزینه‌های ناامن
                  if "allowinsecure=1" in cfg.lower() or "insecure=1" in cfg.lower():
                      unsafe_count += 1
                      continue

                  # ۳. فیلتر سرورهای قطعی خاموش
                  host = extract_host(cfg)
                  if is_definitely_dead(host):
                      dead_count += 1
                      continue

                  # تفکیک بخش کانفیگ بدون اسم جهت حذف تکراری‌ها
                  base_cfg = cfg.split("#")[0].strip()
                  if base_cfg not in unique_configs:
                      unique_configs[base_cfg] = cfg

              print(f"\n🧹 آمار فیلتر {label}:")
              print(f"   کل ورودی: {len(configs)}")
              print(f"   حذف شده (Fragment/JSON): {fragment_count}")
              print(f"   حذف شده (Unsafe): {unsafe_count}")
              print(f"   حذف شده (دامنه مرده NXDOMAIN): {dead_count}")
              print(f"   کانفیگ سالم نهایی: {len(unique_configs)}")
              return list(unique_configs.keys())

          # شروع دریافت به ترتیب اولویت: کاستوم -> تلگرام -> لینک‌های عمومی
          fetch_custom_configs()
          fetch_telegram_channels()
          fetch_public_sources(HY2_PUBLIC_URLS, raw_hy2_items, "Hy2", ("hysteria2://", "hy2://", "hysteria://"))
          fetch_public_sources(VLESS_TROJAN_PUBLIC_URLS, raw_vless_trojan_items, "Vless/Trojan", ("vless://", "trojan://"))

          # فیلتر و یکتا سازی
          cleaned_hy2 = process_and_dedup(raw_hy2_items, "Hy2")
          cleaned_vless_trojan = process_and_dedup(raw_vless_trojan_items, "Vless/Trojan")

          # مدیریت کانتر و نام‌گذاری خروجی
          counter_file = "counter.txt"
          start_counter = 1
          if os.path.exists(counter_file):
              try:
                  with open(counter_file, "r", encoding="utf-8") as f:
                      content = f.read().strip()
                      if content.isdigit():
                          start_counter = int(content) + 1
              except Exception:
                  pass

          current_num = start_counter
          tag_prefix = quote("♾️ULTRA-TITAN-SRV-")

          final_hy2 = [f"{cfg}#{tag_prefix}{current_num + i}" for i, cfg in enumerate(cleaned_hy2)]
          current_num += len(cleaned_hy2)

          final_vless_trojan = [f"{cfg}#{tag_prefix}{current_num + i}" for i, cfg in enumerate(cleaned_vless_trojan)]
          current_num += len(cleaned_vless_trojan)

          with open("hy2_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_hy2) + ("\n" if final_hy2 else ""))

          with open("vless_trojan_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(final_vless_trojan) + ("\n" if final_vless_trojan else ""))

          last_num = current_num - 1 if (len(final_hy2) + len(final_vless_trojan)) > 0 else (start_counter - 1 if start_counter > 1 else 0)
          with open(counter_file, "w", encoding="utf-8") as f:
              f.write(str(last_num))

          print(f"\n🎉 فایل‌ها با موفقیت ذخیره شدند. آخرین شماره کانتر: {last_num}")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hy2_filtered.txt vless_trojan_filtered.txt counter.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hy2 & Vless/Trojan configs [skip ci]" && git push)
